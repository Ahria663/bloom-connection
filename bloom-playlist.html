<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peanut Butter &amp; Jam — Host</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Space+Mono:ital,wght@0,400;0,700;1,400&amp;family=Permanent+Marker&amp;display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        :root{
            --paper:#F1ECE0;--ink:#1B1B1B;--blue:#2A55E5;--pink:#FF4FA3;--muted:#B9B2A2;--card:#FFFFFF;
            --rose:#FF4FA3;--rose-light:#FFD6EA;--rose-deep:#FF4FA3;--blush:#F1ECE0;--cream:#F1ECE0;--petal:#FFD6EA;--lavender:#D9E0FF;
            --text-dark:#1B1B1B;--text-mid:#4A463C;--text-soft:#8A8578;--glass:#FFFFFF;--glass-border:#1B1B1B;--green:#1B1B1B;
        }
        html,body{background:var(--paper);}
        body{font-family:'Space Mono',ui-monospace,monospace;color:var(--ink);min-height:100vh;overflow-x:hidden;}
        .font-serif{font-family:'Archivo Black','Arial Black',sans-serif;letter-spacing:-0.03em;text-transform:uppercase;}
        .font-sans{font-family:'Space Mono',ui-monospace,monospace;}
        .hand{font-family:'Permanent Marker',cursive;}

        .app{max-width:none;margin:0;padding:40px 56px 48px;position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;gap:28px;}
        .zine-main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,520px);gap:48px;min-height:0;align-items:start;}

        .header{display:flex;align-items:center;gap:28px;margin-bottom:0;padding-bottom:16px;border-bottom:4px solid var(--ink);}
        .logo{font-size:clamp(36px,6vw,84px);font-weight:400;letter-spacing:-0.03em;line-height:0.9;color:var(--ink);text-transform:uppercase;}
        .logo.logo-brand{font-family:'Archivo Black','Arial Black',sans-serif;}
        .logo .amp{color:var(--blue);}
        .logo-sub{display:none;}
        .zine-badge{flex-shrink:0;width:120px;height:120px;border-radius:50%;background:var(--pink);color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Permanent Marker',cursive;font-size:19px;line-height:1.05;transform:rotate(-8deg);}
        .header-right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-size:14px;text-transform:uppercase;}
        .spotify-badge{display:flex;align-items:center;gap:8px;background:transparent;border:0;border-radius:0;padding:0;font-family:inherit;font-size:14px;color:var(--ink);font-weight:700;letter-spacing:0;}
        .dot-pulse{width:8px;height:8px;border-radius:50%;background:var(--pink);animation:pulse 2s infinite;}
        .icon-btn,.fab-qr{background:transparent;border:0;border-radius:0;width:auto;height:auto;cursor:pointer;display:block;font-size:14px;padding:0;color:var(--ink);font-family:inherit;letter-spacing:0.04em;text-transform:uppercase;}
        .icon-btn:hover,.fab-qr:hover{background:transparent;}

        .now-playing{background:transparent;border-radius:0;padding:0;margin-bottom:0;border:0;position:relative;overflow:visible;display:flex;gap:36px;align-items:flex-start;}
        .np-glow{display:none;}
        .np-inner{display:contents;}
        .np-art-wrap{position:relative;flex-shrink:0;width:min(340px,34vw);}
        .np-art-wrap::before{content:'';position:absolute;left:14px;top:14px;width:100%;height:100%;background:var(--blue);}
        .np-art,.np-art-placeholder{position:relative;width:100%;aspect-ratio:1;height:auto;border-radius:0;object-fit:cover;flex-shrink:0;border:4px solid var(--ink);background-color:var(--pink);background-image:radial-gradient(#1B1B1B 28%,transparent 30%);background-size:12px 12px;}
        .np-art-placeholder{display:flex;align-items:flex-end;justify-content:flex-start;padding:16px;font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink);}
        .np-art-placeholder span{background:var(--paper);padding:4px 8px;}
        .np-copy{min-width:0;padding-top:4px;flex:1;}
        .np-label{font-family:'Permanent Marker',cursive;font-size:26px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--blue);background:none;padding:0;border-radius:0;display:inline-block;margin-bottom:10px;transform:rotate(-2deg);}
        .np-title{font-family:'Archivo Black','Arial Black',sans-serif;font-size:clamp(32px,4.2vw,58px);font-weight:400;line-height:0.95;letter-spacing:-0.02em;text-transform:uppercase;color:var(--ink);white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;}
        .np-artist{font-size:18px;color:var(--ink);margin-top:12px;font-family:inherit;text-transform:uppercase;}
        .np-req{font-size:14px;margin-top:8px;}
        .np-req b{background:var(--pink);padding:0 6px;font-weight:400;}
        .eq-bars{display:none;}
        .np-progress{margin-top:18px;position:relative;}
        .progress-row{display:flex;align-items:center;gap:12px;font-size:14px;}
        .progress-track{flex:1;height:0;background:transparent;border-radius:0;overflow:visible;border-top:4px dotted var(--ink);position:relative;min-width:80px;}
        .progress-fill{position:absolute;top:-12px;left:0;width:20px;height:20px;background:var(--blue);border:3px solid var(--ink);border-radius:0;transform:translateX(-50%);}
        .progress-times{display:none;}
        .np-controls{display:flex;align-items:center;justify-content:flex-start;gap:10px;margin-top:16px;position:relative;z-index:1;}
        .np-ctrl{width:56px;height:56px;border-radius:0;border:3px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:none;}
        .np-ctrl:hover{background:var(--paper);transform:none;box-shadow:none;}
        .np-ctrl:disabled{opacity:.35;cursor:not-allowed;}
        .np-ctrl.play{width:56px;height:56px;background:var(--ink);border:3px solid var(--ink);color:var(--paper);box-shadow:5px 5px 0 var(--pink);}
        .np-ctrl.play:hover{background:var(--ink);}
        .lyrics-toggle-btn{min-height:56px;padding:0 18px;border:3px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink);font:inherit;font-weight:700;font-size:14px;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;margin-top:0;display:inline-flex;align-items:center;}
        .lyrics-toggle-btn:hover,.lyrics-toggle-btn.active-btn{background:var(--pink);}

        .connect-banner{display:none;}
        .connect-text{font-size:13px;color:var(--ink);font-family:inherit;line-height:1.5;text-transform:uppercase;}
        .connect-text strong{color:var(--ink);}
        .spotify-connect{background:var(--pink);color:var(--ink);border:3px solid var(--ink);border-radius:0;padding:10px 18px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:4px 4px 0 var(--blue);text-transform:uppercase;}
        .spotify-connect:hover{transform:none;}
        .spotify-note{font-size:11px;color:var(--text-soft);font-family:inherit;font-style:normal;}

        .queue-col{min-width:0;position:relative;min-height:420px;}
        .section-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:0;padding-bottom:8px;border-bottom:2px solid var(--ink);}
        .section-title{font-family:'Archivo Black','Arial Black',sans-serif;font-size:28px;font-weight:400;color:var(--ink);text-transform:uppercase;letter-spacing:-0.02em;}
        .section-hint{font-size:14px;color:var(--ink);font-family:inherit;font-style:normal;text-transform:uppercase;}
        #queue{padding-bottom:180px;}
        .song-card{display:flex;align-items:baseline;gap:12px;background:transparent;backdrop-filter:none;border-radius:0;padding:11px 0;border:0;border-bottom:1px dashed var(--ink);margin-bottom:0;box-shadow:none;cursor:default;}
        .song-card:hover{transform:none;box-shadow:none;}
        .song-card.top,.song-card.guest{background:transparent;border-color:transparent;border-bottom:1px dashed var(--ink);box-shadow:none;}
        .song-rank{font-size:16px;font-weight:700;color:var(--ink);min-width:28px;text-align:left;font-family:inherit;}
        .song-art,.song-art-ph{display:none;}
        .song-info{flex:0 1 auto;min-width:0;max-width:46%;}
        .song-title{font-size:16px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:none;}
        .song-dots{flex:1;border-bottom:2px dotted #8A8578;transform:translateY(-4px);min-width:16px;}
        .song-meta{font-size:16px;color:var(--ink);margin-top:0;font-family:inherit;white-space:nowrap;text-align:right;}
        .vote-col{display:none;}
        .remove-btn{width:44px;height:32px;border-radius:0;border:0;background:transparent;cursor:pointer;font-size:16px;line-height:1;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;font-family:inherit;font-weight:700;}
        .remove-btn:hover{background:transparent;color:var(--pink);}
        .empty{text-align:left;padding:18px 0;color:var(--text-soft);font-family:inherit;font-size:14px;text-transform:uppercase;}

        .fab-add{position:fixed;bottom:24px;right:24px;z-index:50;background:var(--paper);border:3px solid var(--ink);border-radius:0;padding:12px 18px;cursor:pointer;display:none;align-items:center;gap:8px;color:var(--ink);font-family:inherit;font-weight:700;font-size:13px;box-shadow:5px 5px 0 var(--pink);text-transform:uppercase;}
        .queue-add{background:none;border:0;color:var(--blue);font:inherit;cursor:pointer;font-weight:700;text-transform:uppercase;}

        .qr-dock{margin-top:48px;}
        .qr-dock .session-qr.is-on{position:relative;left:auto;right:auto;bottom:auto;display:flex;align-items:flex-end;gap:16px;}
        .session-qr{display:none;position:relative;z-index:60;text-align:left;cursor:pointer;}
        .session-qr.is-on{display:flex;align-items:flex-end;gap:16px;}
        .session-qr-card{background:#fff;border:3px solid var(--ink);border-radius:0;padding:16px 16px 12px;box-shadow:none;position:relative;transform:rotate(3deg);}
        .session-qr-card::after{content:'';position:absolute;left:40%;top:-14px;width:90px;height:24px;background:var(--blue);opacity:.75;transform:rotate(-4deg);}
        .session-qr:hover .session-qr-card{box-shadow:none;transform:rotate(3deg);}
        .session-qr-mount{width:130px;height:130px;border-radius:0;overflow:hidden;background:#fff;}
        .session-qr-mount canvas,.session-qr-mount img{display:block;width:130px;height:130px;border-radius:0;}
        .session-qr-label{margin-top:0;font-family:'Permanent Marker',cursive;font-size:24px;font-weight:400;letter-spacing:0;color:var(--ink);max-width:130px;line-height:1.1;}
        .session-qr.is-pulse .session-qr-card{animation:qrPulse .7s ease;}
        @keyframes qrPulse{0%,100%{box-shadow:0 0 0 0 transparent;}40%{box-shadow:8px 8px 0 var(--pink);}}
        body.lyrics-mode .session-qr,
        .session-qr.is-lyrics{position:fixed;left:auto;right:64px;bottom:120px;flex-direction:column;align-items:center;gap:8px;}
        body.lyrics-mode .session-qr-card{transform:rotate(4deg);padding:16px;}
        body.lyrics-mode .session-qr-card::after{background:var(--pink);opacity:.8;left:30%;transform:rotate(-5deg);}
        body.lyrics-mode .session-qr-mount,body.lyrics-mode .session-qr-mount canvas,body.lyrics-mode .session-qr-mount img{width:150px;height:150px;}
        body.lyrics-mode .session-qr-label{font-size:20px;max-width:150px;text-align:center;}

        .overlay{position:fixed;inset:0;background:rgba(27,27,27,.4);backdrop-filter:none;z-index:100;display:flex;align-items:center;justify-content:center;}
        .modal-card{background:var(--paper);border-radius:0;padding:36px;max-width:360px;width:90%;box-shadow:8px 8px 0 var(--pink);border:3px solid var(--ink);text-align:center;}
        .modal-title{font-family:'Archivo Black',sans-serif;font-size:28px;font-weight:400;color:var(--ink);margin-bottom:6px;text-transform:uppercase;}
        .modal-sub{font-size:13px;color:var(--text-soft);line-height:1.6;font-family:inherit;margin-bottom:22px;}
        .sheet-overlay{position:fixed;inset:0;background:rgba(27,27,27,.4);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
        .sheet{background:var(--paper);border-radius:0;padding:24px;width:100%;max-width:520px;box-shadow:none;border:3px solid var(--ink);border-bottom:0;padding-bottom:36px;}
        .sheet-handle{width:40px;height:4px;background:var(--ink);border-radius:0;margin:0 auto 20px;opacity:.4;}
        .sheet-title{font-family:'Archivo Black',sans-serif;font-size:28px;font-weight:400;color:var(--ink);margin-bottom:16px;text-transform:uppercase;}
        .search-wrap{position:relative;margin-bottom:14px;}
        .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-soft);font-size:15px;}
        .search-input{width:100%;padding:12px 14px 12px 40px;border:2px solid var(--ink);border-radius:0;font-family:inherit;font-size:14px;background:#fff;color:var(--ink);outline:none;}
        .results-list{display:flex;flex-direction:column;gap:0;max-height:300px;overflow-y:auto;}
        .result-item{display:flex;align-items:center;gap:12px;padding:10px 0;background:transparent;border-radius:0;cursor:pointer;border:0;border-bottom:1px dashed var(--ink);}
        .result-item:hover,.result-item.added-flash{background:transparent;}
        .result-art{width:42px;height:42px;border-radius:0;flex-shrink:0;background:var(--pink);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:16px;object-fit:cover;}
        .result-title{font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;}
        .result-artist,.result-dur{font-size:12px;color:var(--text-soft);font-family:inherit;}
        .qr-box{display:inline-block;padding:14px;background:#fff;border-radius:0;margin-bottom:18px;border:3px solid var(--ink);}
        .qr-box canvas{display:block;border-radius:0;max-width:100%;height:auto;}
        .qr-fallback{font-size:12px;color:var(--text-soft);font-family:inherit;padding:12px;}
        .close-btn{background:var(--ink);color:var(--paper);border:3px solid var(--ink);border-radius:0;padding:10px 28px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;text-transform:uppercase;}
        .close-btn:hover{background:var(--ink);}
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;background:var(--ink);color:var(--paper);border-radius:0;padding:10px 22px;font-size:12px;font-weight:700;box-shadow:5px 5px 0 var(--pink);letter-spacing:0.06em;text-transform:uppercase;white-space:nowrap;font-family:inherit;}

        @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
        @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
        @keyframes popIn{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:scale(1);}}
        @keyframes slideUp{from{opacity:0;transform:translateY(40px);}to{opacity:1;transform:translateY(0);}}
        @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
        @keyframes eq1{0%,100%{height:6px;}50%{height:18px;}}
        @keyframes eq2{0%,100%{height:12px;}50%{height:6px;}}
        @keyframes eq3{0%,100%{height:8px;}50%{height:16px;}}
        @keyframes eq4{0%,100%{height:16px;}50%{height:8px;}}
        @keyframes eq5{0%,100%{height:10px;}50%{height:20px;}}
        @keyframes cardIn{from{opacity:0;}to{opacity:1;}}
        .eq-bars.np-paused .eq-bar{animation-play-state:paused;opacity:.45;}

        body.lyrics-mode{overflow:hidden;}
        body.lyrics-mode .app{display:none;}
        .split-lyrics-panel{display:none;position:fixed;inset:0;width:auto;min-width:0;flex-direction:column;padding:40px 56px 28px;background:var(--paper);border:0;z-index:10;overflow:hidden;}
        body.lyrics-mode .split-lyrics-panel{display:flex;}
        .lyrics-top{display:flex;align-items:center;gap:20px;border-bottom:4px solid var(--ink);padding-bottom:14px;margin-bottom:8px;}
        .lyrics-brand{font-family:'Archivo Black',sans-serif;font-size:40px;line-height:1;letter-spacing:-0.03em;}
        .lyrics-brand .amp{color:var(--blue);}
        .lyrics-mini-art{width:48px;height:48px;flex-shrink:0;background-color:var(--pink);background-image:radial-gradient(#1B1B1B 28%,transparent 30%);background-size:6px 6px;border:3px solid var(--ink);background-position:center;background-repeat:no-repeat;}
        .lyrics-mini-art.has-art{background-size:cover;}
        #lyricsNowMeta{font-size:16px;text-transform:uppercase;}
        .lyrics-top-spacer{flex:1;}
        .lyrics-mini-play{width:52px;height:52px;border:3px solid var(--ink);background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;cursor:pointer;}
        .lyrics-close{min-height:52px;padding:0 18px;border:3px solid var(--ink);background:var(--paper);color:var(--ink);font:inherit;font-weight:700;font-size:14px;text-transform:uppercase;cursor:pointer;}
        .lyrics-status{display:none;}
        .lyrics-karaoke{flex:1;overflow:hidden;position:relative;mask-image:none;-webkit-mask-image:none;}
        .lyrics-scroll{display:flex;flex-direction:column;align-items:flex-start;padding:28vh 320px 28vh 0;transition:transform .6s cubic-bezier(.22,1,.36,1);gap:10px;}
        .lyric-line{font-family:'Archivo Black','Arial Black',sans-serif;font-size:clamp(22px,2.6vw,34px);font-weight:400;line-height:1.05;color:var(--muted);opacity:1;text-transform:uppercase;letter-spacing:-0.02em;padding:0;text-align:left;}
        .lyric-line.active{color:var(--ink);font-size:clamp(40px,5.4vw,72px);line-height:0.98;transform:none;}
        .lyric-line.active span{background:var(--pink);padding:0 10px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
        .lyric-line.past{opacity:1;color:var(--muted);}
        .lyric-line.next{opacity:1;color:var(--blue);}
        .lyric-line.after{color:var(--muted);}
        .lyric-line.empty{height:16px;}
        .lyrics-foot{font-size:14px;border-top:2px solid var(--ink);padding-top:10px;text-transform:uppercase;}

        @media (max-width:1100px){
            .app{padding:24px 20px 140px;}
            .header{flex-wrap:wrap;}
            .zine-main,.now-playing{grid-template-columns:1fr;display:flex;flex-direction:column;}
            .np-art-wrap{width:min(280px,80vw);}
            .session-qr-mount,.session-qr-mount canvas,.session-qr-mount img{width:96px;height:96px;}
            .session-qr-label{font-size:16px;max-width:90px;}
            body.lyrics-mode .session-qr,
            .session-qr.is-lyrics{left:auto;right:16px;bottom:100px;}
            .split-lyrics-panel{padding:18px 16px 110px;}
            .lyrics-scroll{padding-right:0;}
            .lyrics-top{flex-wrap:wrap;}
            #lyricsNowMeta{font-size:12px;}
        }
    </style>
</head>
<body>

<div class="app" id="app">

    <div class="header">
        <div class="logo logo-brand">Peanut Butter<br><span class="amp">&amp;</span> Jam</div>
        <div class="zine-badge hand">collab<br>playlist!</div>
        <div class="header-right" id="headerRight"></div>
    </div>

    <div class="connect-banner" id="connectBanner">
        <div class="connect-text"><strong>Connect Spotify</strong><br>to add songs to your real queue
            <div id="redirectHint" class="spotify-note" style="margin-top:8px;font-style:normal;display:none;"></div>
        </div>
        <button class="spotify-connect font-sans" style="margin:0;" onclick="connectSpotify()">Connect</button>
    </div>

    <div class="zine-main">
        <div class="now-playing" id="nowPlaying">
            <div class="np-glow"></div>
            <div class="np-art-wrap">
                <div class="np-art-placeholder" id="npArtPh" aria-hidden="true"><span>Album art</span></div>
                <img class="np-art" id="npArt" style="display:none" alt="album art" onerror="this.style.display='none';var p=document.getElementById('npArtPh');if(p)p.style.display='flex'" />
            </div>
            <div class="np-copy">
                <div class="np-label font-sans" id="npLabel">now spinning →</div>
                <div class="np-title font-serif" id="npTitle">Nothing playing yet</div>
                <div class="np-artist font-sans" id="npArtist">Connect Spotify to get started</div>
                <div class="np-req" id="npReq" style="display:none;">req. by <b id="npRequestedBy"></b></div>
                <div class="eq-bars" id="npEqBars" style="display:none">
                    <div class="eq-bar" style="animation:eq1 .7s ease-in-out infinite;"></div>
                    <div class="eq-bar" style="animation:eq2 .6s ease-in-out infinite;"></div>
                    <div class="eq-bar" style="animation:eq3 .8s ease-in-out infinite;"></div>
                    <div class="eq-bar" style="animation:eq4 .65s ease-in-out infinite;"></div>
                    <div class="eq-bar" style="animation:eq5 .75s ease-in-out infinite;"></div>
                </div>
                <div class="np-progress">
                    <div class="progress-row">
                        <span id="progressTime">0:00</span>
                        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
                        <span id="progressTotal">0:00</span>
                    </div>
                </div>
                <div class="np-controls" id="npControls">
                    <button type="button" class="np-ctrl" id="npPrev" onclick="playerPrev()" title="Previous" aria-label="Previous">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M6 5v14"></path><path d="M18 5 9 12l9 7z"></path></svg>
                    </button>
                    <button type="button" class="np-ctrl play" id="npPlay" onclick="playerToggle()" title="Pause" aria-label="Pause">
                        <svg id="npPlayIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7L8 5z"/></svg>
                    </button>
                    <button type="button" class="np-ctrl" id="npNext" onclick="playerNext()" title="Skip" aria-label="Skip">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M18 5v14"></path><path d="M6 5l9 7-9 7z"></path></svg>
                    </button>

            .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

        const params = new URLSearchParams(window.location.search);

        if (err) {
            toast(decodeURIComponent(params.get('error_description') || err).replace(/\+/g, ' '));
            cleanOAuthUrl();
            return;
        }
        const code = params.get('code');
        if (!code) return;
        const state = params.get('state');
        if (state !== sessionStorage.getItem('spotify_oauth_state')) {
            toast('Login session expired — tap Connect again');
            cleanOAuthUrl();
            return;
        }
        const verifier = sessionStorage.getItem('spotify_pkce_verifier');
        const id = sessionStorage.getItem('spotify_client_id') || window._clientId || CLIENT_ID;
        if (!verifier || !id) {
            toast('Missing login data — try Connect again');
            cleanOAuthUrl();
            return;
        }
        const body = new URLSearchParams({
            grant_type: 'authorization_code',
            code: code,
            redirect_uri: getRedirectUri(),
            client_id: id,
            code_verifier: verifier,
        });
        let res;
        try {
            res = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },

        const body = new URLSearchParams({
            grant_type: 'refresh_token',
            refresh_token: rt,
            client_id: id,
        });
        const res = await fetch('https://accounts.spotify.com/api/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },

        });

        if (r.status === 401 && await refreshSpotifyToken()) {
            headers.Authorization = 'Bearer ' + spotifyToken;
            r = await fetch(url, Object.assign({}, opts, { headers }));
        }
        return r;

function normalizeSpotifyQueueItem(item){
  if(!item || !item.uri) return null;
  if(item.show || item.type === 'episode'){
    const imgs = item.images || [];
    const art = imgs.find(i => i.width >= 300)?.url || imgs[0]?.url || '';
    return {
      id: item.id,
      uri: item.uri,
      title: item.name || '—',
      artist: item.show?.name || 'Podcast',
      art,
    };
  }
  if(item.name && item.album){
    const imgs = item.album.images || [];
    const art = imgs.find(i => i.width >= 300)?.url || imgs[0]?.url || '';
    return {
      id: item.id,
      uri: item.uri,
      title: item.name,
      artist: (item.artists || []).map(a => a.name).join(', '),
      art,
    };
  }
  return null;
}
 
function spotifyQueueSignature(list){
  return list.map(x => x.uri).join('\x1e');
}
 
async function fetchSpotifyQueue(){
  if(!spotifyToken) return;
  try{
    const r = await spotifyApiFetch('https://api.spotify.com/v1/me/player/queue',{});
    if(r.status === 204 || r.status === 404){
      if(lastSpotifyQueueSig === '' && spotifyQueueList.length === 0) return;
      lastSpotifyQueueSig = '';
      spotifyQueueList = [];
      pruneBloomHiddenQueueUris(spotifyQueueList);
      renderQueue();
      return;
    }
    if(!r.ok){
      if(lastSpotifyQueueSig === '' && spotifyQueueList.length === 0) return;
      lastSpotifyQueueSig = '';
      spotifyQueueList = [];
      pruneBloomHiddenQueueUris(spotifyQueueList);
      renderQueue();
      return;
    }
    const data = await r.json();
    const curFromQueue = data.currently_playing?.uri;
    const curUri = curFromQueue || nowPlayingTrackUri;
    const raw = data.queue || [];
    const newList = raw
      .map(normalizeSpotifyQueueItem)
      .filter(Boolean)
      .filter(x => x.uri !== curUri);
    const sig = spotifyQueueSignature(newList);
    if(sig === lastSpotifyQueueSig) return;
    lastSpotifyQueueSig = sig;
    spotifyQueueList = newList;
    pruneBloomHiddenQueueUris(newList);
    renderQueue();
  } catch(e){
    if(lastSpotifyQueueSig === '' && spotifyQueueList.length === 0) return;
    lastSpotifyQueueSig = '';
    spotifyQueueList = [];
    pruneBloomHiddenQueueUris(spotifyQueueList);
    renderQueue();
  }
}
 
function renderQueue(){
  const el = document.getElementById('queue');
  const hint = document.getElementById('queueSectionHint');
  if(spotifyToken){
    if(hint) hint.textContent = 'Live from Spotify — × removes from Bloom only (Spotify has no remove-from-queue API)';
    const visible = spotifyVisibleQueue();
    const n = visible.length;
    const apiN = spotifyQueueList.length;
    const paintSig = spotifyQueuePaintSig();
    if(el.getAttribute('data-queue-sig') === paintSig) return;
    el.setAttribute('data-queue-sig', paintSig);
    document.getElementById('queueCount').textContent = n ? `${n} trks` : (apiN ? 'all hidden' : '0 trks');
    if (typeof publishBloomState === 'function') {
      clearTimeout(window._publishTimer);
      window._publishTimer = setTimeout(publishBloomState, 200);
    }
    if(apiN === 0){
      el.innerHTML = '<div class="empty">Nothing queued yet — add a song or keep listening in Spotify.</div>';
      syncLyricsChrome();
      return;
    }
    if(n === 0){
      el.innerHTML = '<div class="empty">Every upcoming track is hidden in Bloom. They can still play in Spotify — clear them in the Spotify app, or wait until the queue changes.</div>';
      syncLyricsChrome();
      return;
    }
    el.innerHTML = visible.map((s,i)=>`
        <div class="song-card ${i===0?'top':''}">
            <span class="song-rank font-sans">B${i+1}</span>
            <span class="song-title">${esc(s.title)}</span>
            <span class="song-dots"></span>
            <span class="song-meta font-sans">${esc(s.artist)}</span>
            <button type="button" class="remove-btn" data-queue-rm="${escAttr(s.uri)}" onclick="removeSpotifyQueueRow(this.getAttribute('data-queue-rm'))" title="Remove from Bloom list (Spotify may still play this track)" aria-label="Remove from Bloom list">✕</button>
        </div>`).join('');
    syncLyricsChrome();
    return;
  }
  el.removeAttribute('data-queue-sig');
  const sorted = [...songs].sort((a,b)=>b.votes-a.votes);
  document.getElementById('queueCount').textContent = `${sorted.length} trks`;
  if(!sorted.length){ el.innerHTML='<div class="empty">No songs yet — add the first one.</div>'; syncLyricsChrome(); return; }
  el.innerHTML = sorted.map((s,i)=>`
        <div class="song-card ${i===0?'top':''}${s.by&&s.by!==''?' guest':''}">
            <span class="song-rank font-sans">B${i+1}</span>
            <span class="song-title">${esc(s.title)}</span>

// lyricsLines now stores {time, text} objects for timestamped sync
// time is in seconds (from lrclib), text is the lyric line
let lastLyricsFetch = '';
let lyricsTimestamped = false; // true if we have real timestamps

async function fetchLyricsKaraoke(title, artist){
  if(!title || !artist) return;
  const key = title + '||' + artist;

  const status = document.getElementById('lyricsStatus');
  const scroll = document.getElementById('lyricsScroll');

  if(status) status.textContent = '\u266a ' + title + ' \u2014 ' + artist;

  if(key === lastLyricsFetch) return;
  lastLyricsFetch = key;
  lyricsLines = [];
  lyricsActiveIdx = -1;
  lyricsTimestamped = false;
  clearInterval(lyricsTickTimer);
  if(scroll) scroll.innerHTML = '<div class="lyric-line after"><span>Loading lyrics\u2026</span></div>';

  const cleanTitle  = title.replace(/\s*[\(\[].*?[\)\]]/g, '').trim();
  const cleanArtist = artist.split(',')[0].trim();

  // Try lrclib first — has real timestamps
  try {
    const dur = npLast ? Math.round(npLast.duration_ms / 1000) : 0;
    const lrcUrl = 'https://lrclib.net/api/get?track_name=' + encodeURIComponent(cleanTitle) +
      '&artist_name=' + encodeURIComponent(cleanArtist) +
      (dur ? '&duration=' + dur : '');
    const r = await fetch(lrcUrl);
    if(r.ok){
      const data = await r.json();
      // syncedLyrics has timestamps: [mm:ss.xx] line text
      const lrc = data.syncedLyrics || data.plainLyrics || '';
      if(lrc && data.syncedLyrics){
        // Parse LRC format: [00:12.34] Some lyric line
        const lrcLines = data.syncedLyrics.split('\n');
        lyricsLines = [];
        for(const line of lrcLines){
          const m = line.match(/^\[(\d+):(\d+\.?\d*)\](.*)$/);
          if(m){
            const secs = parseInt(m[1])*60 + parseFloat(m[2]);
            const text = m[3].trim();
            lyricsLines.push({ time: secs, text });
          }
        }
        lyricsLines.sort(function(a,b){ return a.time - b.time; });
        lyricsTimestamped = true;
        if(status) status.textContent = '\u266a ' + title + ' \u2014 ' + artist;
        renderLyricsLines();
        startLyricsTick();
        return;
      } else if(lrc && data.plainLyrics){
        // Fallback: plain lyrics, use progress estimation
        const raw = data.plainLyrics.trim().split('\n');
        lyricsLines = [];
        let blankRun = 0;
        for(const line of raw){
          const t = line.trim();
          if(!t){ blankRun++; if(blankRun <= 1) lyricsLines.push({time:-1, text:''}); }
          else { blankRun = 0; lyricsLines.push({time:-1, text:t}); }
        }
        renderLyricsLines();
        startLyricsTick();
        return;
      }
    }
  } catch(e) {}

  // Fallback: lyrics.ovh
  try {
    const ovhUrl = 'https://api.lyrics.ovh/v1/' + encodeURIComponent(cleanArtist) + '/' + encodeURIComponent(cleanTitle);
    const r2 = await fetch(ovhUrl);
    if(r2.ok){
      const data2 = await r2.json();
      if(data2.lyrics){
        const raw = data2.lyrics.trim().split('\n');
        lyricsLines = [];
        let blankRun = 0;
        for(const line of raw){
          const t = line.trim();
          if(!t){ blankRun++; if(blankRun <= 1) lyricsLines.push({time:-1, text:''}); }
          else { blankRun = 0; lyricsLines.push({time:-1, text:t}); }
        }
        renderLyricsLines();
        startLyricsTick();
        return;
      }
    }
  } catch(e) {}

  // Nothing found
  if(scroll) scroll.innerHTML = '<div class="lyric-line after"><span>Lyrics not found</span></div><div class="lyric-line next"><span><a href="https://genius.com/search?q=' + encodeURIComponent(title+' '+artist) + '" target="_blank" style="color:inherit">Search on Genius</a></span></div>';
}

function renderLyricsLines(){
  const scroll = document.getElementById('lyricsScroll');
  if(!scroll) return;
  scroll.innerHTML = lyricsLines.map(function(line, i){
    if(!line.text) return '<div class="lyric-line empty" data-idx="' + i + '"></div>';
    return '<div class="lyric-line" data-idx="' + i + '"><span>' + esc(line.text) + '</span></div>';
  }).join('');
}

function startLyricsTick(){
  clearInterval(lyricsTickTimer);
  lyricsTickTimer = setInterval(tickLyrics, 100);
}

function tickLyrics(){
  if(!lyricsLines.length || !npLast) return;
  const prog = npLast.is_playing
    ? Math.min(npLast.progress_ms + (Date.now() - npLast.fetchedAt), npLast.duration_ms)
    : npLast.progress_ms;
  const progSecs = prog / 1000;

  let lineIdx = 0;
  if(lyricsTimestamped){
    // Real timestamps — find the last line whose time <= current position
    for(let i = lyricsLines.length - 1; i >= 0; i--){
      if(lyricsLines[i].time <= progSecs){
        lineIdx = i;
        break;
      }
    }
  } else {
    // Estimated — spread lines evenly across duration
    const pct = prog / (npLast.duration_ms || 1);
    lineIdx = Math.min(Math.floor(pct * lyricsLines.length), lyricsLines.length - 1);
  }

  if(lineIdx === lyricsActiveIdx) return;
  lyricsActiveIdx = lineIdx;

  const scroll = document.getElementById('lyricsScroll');
  if(!scroll) return;

  const allLines = scroll.querySelectorAll('.lyric-line');
  allLines.forEach(function(el, i){
    el.classList.remove('active','past','next','after');
    if(i < lineIdx) el.classList.add('past');
    else if(i === lineIdx) el.classList.add('active');
    else if(i === lineIdx + 1) el.classList.add('next');
    else el.classList.add('after');
  });

  // Smooth scroll active line to center
  const active = scroll.querySelector('.lyric-line.active');
  if(active){
    const karaoke = document.getElementById('lyricsKaraoke');
    const karaokeH = karaoke ? karaoke.offsetHeight : 400;
    const offset = active.offsetTop - (karaokeH * 0.38);
    scroll.style.transform = 'translateY(' + (-offset) + 'px)';
  }
}

function playerErrorToast(err){
  const msg = String(err || '');
  if(/restriction/i.test(msg)){
    toast('Spotify blocked that — Premium, an active device, and no DJ/private session');

  }

async function playerCommand(path, method, deviceId){
  if(!spotifyToken){
    toast('Connect Spotify to control playback');
    return false;
  }
  try{
    let url = 'https://api.spotify.com/v1/me/player/' + path;
    if(deviceId) url += (url.includes('?') ? '&' : '?') + 'device_id=' + encodeURIComponent(deviceId);
    const r = await spotifyApiFetch(url, { method: method || 'POST' });
    if(r.status === 404){
      toast('Start playback on a Spotify device first (Premium)');
      return false;
    }
    if(!r.ok && r.status !== 204){
      const j = await r.json().catch(()=>({}));
      playerErrorToast(j.error?.message || 'Playback control failed');
      return false;
    }
    setTimeout(fetchNowPlaying, 400);
    setTimeout(fetchSpotifyQueue, 800);
    return true;
  } catch(e){
    toast('Playback control failed');
    return false;
  }
}

  const player = await getActivePlayer().catch(()=>null);
  await playerCommand('previous', 'POST', player && player.device && player.device.id);
}

async function playerNext(){

async function playerToggle(){
  if(!spotifyToken){
    toast('Connect Spotify to control playback');
    return;
  }
  const player = await getActivePlayer().catch(()=>null);
  if(!player || !player.device){
    toast('Start playback on a Spotify device first (Premium)');
    return;
  }
  const playing = !!player.is_playing;
  setPlayPauseIcon(!playing);
  if(npLast) npLast.is_playing = !playing;
  const ok = await playerCommand(playing ? 'pause' : 'play', 'PUT', player.device.id);
  if(!ok){
    setPlayPauseIcon(playing);
    if(npLast) npLast.is_playing = playing;
  }
}

async function fetchNowPlaying(){
  if(!spotifyToken) return;
  try{
    const r = await spotifyApiFetch('https://api.spotify.com/v1/me/player', {});
    if(r.status === 204 || r.status === 404){
      showNowPlayingIdle('Nothing playing', 'Open Spotify and press play on any device');
      return;
    }
    if(!r.ok) return;
    const data = await r.json();
    if(!data.item){
      showNowPlayingIdle('Nothing playing', 'Play a track in Spotify to see it here');
      return;
    }
    if(data.currently_playing_type === 'episode'){
      const ep = data.item;
      nowPlayingTrackUri = ep.uri || null;
      const showName = ep.show?.name || 'Podcast';
      const label = document.getElementById('npLabel');
      const eq = document.getElementById('npEqBars');
      if(label) label.textContent = data.is_playing ? 'now spinning →' : 'paused →';
      if(eq) eq.classList.toggle('np-paused', !data.is_playing);
      setPlayPauseIcon(!!data.is_playing);
      document.getElementById('npTitle').textContent = ep.name || '—';
      document.getElementById('npArtist').textContent = showName;
      const eimgs = ep.images || [];
      const eArt = eimgs.find(i => i.width >= 300)?.url || eimgs[0]?.url || '';
      setNpArt(eArt || '');
      npLast = {
        item: ep,
        progress_ms: data.progress_ms || 0,
        duration_ms: ep.duration_ms || 1,
        is_playing: !!data.is_playing,
        fetchedAt: Date.now(),
      };
      tickNowPlayingFromCache();
      return;
    }
    // If the track changed, clear the previous song from guest queue
    const incomingUri = data.item.uri || null;
    if (incomingUri && incomingUri !== nowPlayingTrackUri && nowPlayingTrackUri) {
        clearPlayedSongFromQueue(nowPlayingTrackUri);
    }
    nowPlayingTrackUri = incomingUri;
    npLast = {
      item: data.item,
      progress_ms: data.progress_ms || 0,
      duration_ms: data.item.duration_ms || 1,
      is_playing: !!data.is_playing,
      fetchedAt: Date.now(),
    };
    applySpotifyTrackToUI(data.item, !!data.is_playing);
    tickNowPlayingFromCache();
    syncSessionToServer();
    if (typeof publishBloomState === 'function') publishBloomState();
  } catch(e){}
}

            const data = await r.json();

            id:t.id, uri:t.uri,
            title:t.name,
            artist:t.artists.map(a=>a.name).join(', '),
            dur:`${Math.floor(t.duration_ms/60000)}:${String(Math.floor((t.duration_ms%60000)/1000)).padStart(2,'0')}`,
            art: t.album.images[1]?.url || t.album.images[0]?.url || '',
        }));
    }catch(e){}
    } else {
        // demo fallback
        results = [...DEMO_SONGS, ...SEARCH_DEMOS].filter(s=>
            s.title.toLowerCase().includes(q.toLowerCase()) ||

    res.innerHTML = results.map(s=>`
    <div class="result-item" id="ri-${s.id}" onclick="addSong(${JSON.stringify(s).replace(/"/g,'&quot;')})">
      ${s.art ? `<img style="width:42px;height:42px;border-radius:8px;object-fit:cover;flex-shrink:0;" src="${s.art}" alt="" onerror="this.outerHTML='<div class=\\'result-art\\'>🎵</div>'" />` : `<div class="result-art">🎵</div>`}
      <div style="flex:1;min-width:0;">
        <div class="result-title font-serif">${esc(s.title)}</div>
        <div class="result-artist">${esc(s.artist)}</div>

    async function addSong(s){
        const el = document.getElementById('ri-'+s.id);
        if(el){ el.classList.add('added-flash'); el.innerHTML = el.innerHTML.replace('result-dur','result-dur').replace(s.dur||s.duration||'','✓'); }
        // add to Spotify queue
        if(spotifyToken && s.uri){
            try{
                const qr = await spotifyApiFetch(`https://api.spotify.com/v1/me/player/queue?uri=${encodeURIComponent(s.uri)}`,{method:'POST'});
                if(qr.status===404) toast('Start playback on a Spotify device first (Premium)');
                else if(!qr.ok && qr.status!==204){ const j=await qr.json().catch(()=>({})); toast(j.error?.message||'Could not add to Spotify queue'); }
            }catch(e){}
        }
        if(!spotifyToken){
            if(!songs.find(x=>x.id===s.id)){
                songs.unshift({...s,votes:1,by:'@you',emoji:s.emoji||'🎵'});
            }
        }
        toast(`"${s.title}" added to queue ♥`);
        setTimeout(async ()=>{
            closeModals();
            if(spotifyToken) await fetchSpotifyQueue();
            render();
        },800);
    }
 
    function getEmoji(title){
        const t = title.toLowerCase();
        if(t.includes('summer')||t.includes('sun')) return '☀️';
        if(t.includes('night')||t.includes('moon')) return '🌙';
        if(t.includes('love')||t.includes('heart')) return '💕';
        if(t.includes('flower')||t.includes('rose')) return '🌸';
        if(t.includes('rain')) return '🌧️';
        if(t.includes('fire')) return '🔥';
        if(t.includes('star')) return '⭐';
        if(t.includes('sky')) return '🌤️';
        const emojis=['🎵','🎶','💫','✨','🌿','🎀','🫶','🌺','🍒','🌙'];
        return emojis[Math.floor(Math.random()*emojis.length)];
    }
 
    function guestInviteUrl(sid){
        // Always the public production guest page — preview *.vercel.app URLs
        // require Vercel SSO and would force guests to log in.
        return PUBLIC_ORIGIN + '/guest.html?session=' + encodeURIComponent(sid);
    }

    function loadQRScript(){
        return new Promise((res, rej) => {
            if (typeof qrcode === 'function') return res();
            const s = document.createElement('script');
            s.src = '/vendor/qrcode.min.js';
            s.onload = () => (typeof qrcode === 'function' ? res() : rej(new Error('qr')));
            s.onerror = () => rej(new Error('qr'));
            document.head.appendChild(s);
        });
    }

    function paintQRCode(mount, text, width){
        mount.textContent = '';
        const qr = qrcode(0, 'M');
        qr.addData(text);
        qr.make();
        const cells = qr.getModuleCount();
        const size = width || 120;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        if (!ctx) throw new Error('canvas');
        const scale = size / cells;
        ctx.fillStyle = '#fdf0f3';
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = '#2d1a22';
        for (let r = 0; r < cells; r++) {
            for (let c = 0; c < cells; c++) {
                if (qr.isDark(r, c)) {
                    ctx.fillRect(Math.floor(c * scale), Math.floor(r * scale), Math.ceil(scale), Math.ceil(scale));
                }
            }
        }
        mount.appendChild(canvas);
    }

    function pulseSessionQR(){
        const wrap = document.getElementById('persistentQR');
        if (!wrap) return;
        wrap.classList.remove('is-pulse');
        void wrap.offsetWidth;
        wrap.classList.add('is-pulse');
        setTimeout(() => wrap.classList.remove('is-pulse'), 800);
    }

    async function openQR(){
        let sid = bloomSessionId || sessionStorage.getItem('bloom_session_id');
        if (!sid) {
            if (spotifyToken) {
                await startSession();
                return;
            }
            toast('Connect Spotify to start a session');
            return;
        }
        await showPersistentQR(sid);
        pulseSessionQR();
    }

    async function startSession() {
        toast('Starting session…');
        const rt = sessionStorage.getItem('spotify_refresh_token');

        renderHeader();
    }

    async function showPersistentQR(sid) {
        if (!sid) return;
        const wrap = document.getElementById('persistentQR');
        const mount = document.getElementById('persistentQRMount');
        if (!wrap || !mount) return;
        const guestUrl = guestInviteUrl(sid);
        wrap.classList.add('is-on');
        placeSessionQR(lyricsOpen);
        wrap.title = 'Scan to join · click to copy invite link';
        wrap.onclick = function() {
            if (navigator.clipboard && guestUrl) {
                navigator.clipboard.writeText(guestUrl).then(() => toast('Invite link copied')).catch(() => {});
            }
        };
        try {
            await loadQRScript();
            await paintQRCode(mount, guestUrl, 120);
        } catch (e) {
            mount.textContent = '';
            const img = document.createElement('img');
            img.alt = 'Scan to add a song';
            img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=120x120&margin=1&data=' + encodeURIComponent(guestUrl);
            mount.appendChild(img);
        }
        const label = document.getElementById('persistentQRLabel');
        if (label) label.textContent = lyricsOpen ? 'add a song!' : 'scan me & add a song';
    }

    function closeModals(){ document.getElementById('modals').innerHTML=''; }
    function closeIfBackdrop(e,id){ if(e.target.id===id) closeModals(); }

    // ── Supabase + Sessions ────────────────────────────────
    const SUPABASE_URL  = 'https://wbtbkqczxttkntjzafgq.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndidGJrcWN6eHR0a250anphZmdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NTkzMTAsImV4cCI6MjA5MDIzNTMxMH0.81yC0IWVll9ktKJyciKnC-bsO9atFydvszES_zzo-4k';
    const QUEUE_TABLE   = 'bloom_queue';

    let bloomSessionId = sessionStorage.getItem('bloom_session_id') || localStorage.getItem('bloom_session_id') || null;
    if (bloomSessionId) {
        sessionStorage.setItem('bloom_session_id', bloomSessionId);
        localStorage.setItem('bloom_session_id', bloomSessionId);
    }
    let guestQueueItems = [];
    let sessionSyncTimer = null;
    const hostPushedUris = new Set();

    function snapshotNowPlaying() {
      const title = (document.getElementById('npTitle') || {}).textContent || '';
      const artist = (document.getElementById('npArtist') || {}).textContent || '';
      const img = document.getElementById('npArt');
      let progress_ms = 0, duration_ms = 0, playing = false, uri = nowPlayingTrackUri || '';
      if (npLast && npLast.item) {
        progress_ms = npLast.progress_ms || 0;
        if (npLast.is_playing) progress_ms += Date.now() - (npLast.fetchedAt || Date.now());
        duration_ms = npLast.duration_ms || 0;
        playing = !!npLast.is_playing;
        uri = (npLast.item.uri || uri);
      }
      return {
        playing,
        title: title === 'Nothing playing yet' || title === 'Nothing playing' ? '' : title,
        artist,
        art: (img && img.src && img.style.display !== 'none') ? img.src : '',
        uri,
        progress_ms: Math.max(0, progress_ms),
        duration_ms,
      };
    }

    async function syncSessionToServer() {
      if (!bloomSessionId || !spotifyToken) return;
      try {
        const r = await fetch('/api/session-sync', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessionId: bloomSessionId,
            accessToken: spotifyToken,
            refreshToken: sessionStorage.getItem('spotify_refresh_token') || '',
            nowPlaying: snapshotNowPlaying(),
          }),
        });
        const data = await r.json().catch(() => ({}));
        const pending = data.queue || [];
        for (let i = 0; i < pending.length; i++) {
          const t = pending[i];
          if (!t || !t.uri || hostPushedUris.has(t.uri)) continue;
          hostPushedUris.add(t.uri);
          spotifyApiFetch(
            'https://api.spotify.com/v1/me/player/queue?uri=' + encodeURIComponent(t.uri),
            { method: 'POST' }
          ).catch(function () {});
        }
      } catch (e) {}
    }

    function startSessionSync() {
      if (sessionSyncTimer) return;
      syncSessionToServer();
      sessionSyncTimer = setInterval(syncSessionToServer, 3000);
      startBloomBus();
    }

    let bloomBus = null;
    let guestRequested = [];
    const BLOOM_MQTT_URLS = [
      'wss://broker.emqx.io:8084/mqtt',
      'wss://broker.hivemq.com:8884/mqtt',
    ];

    function bloomTopic() {
      return 'bloom/' + bloomSessionId;
    }

    function guestQueueForBroadcast() {
      const seen = new Set();
      const out = [];
      const vis = spotifyToken ? spotifyVisibleQueue() : [...songs].sort(function(a,b){ return b.votes - a.votes; });
      vis.concat(guestRequested).forEach(function(s){
        if (!s || !s.uri || seen.has(s.uri) || s.uri === nowPlayingTrackUri) return;
        seen.add(s.uri);
        out.push({
          uri: s.uri,
          title: s.title,
          artist: s.artist || '',
          art: s.art || '',
          added_by: s.added_by || s.by || '',
        });
      });
      return out;
    }

    function publishBloomState() {
      if (!bloomBus || !bloomBus.connected || !bloomSessionId) return;
      const payload = JSON.stringify({
        nowPlaying: snapshotNowPlaying(),
        queue: guestQueueForBroadcast(),
      });
      bloomBus.publish(bloomTopic() + '/state', payload, { retain: true, qos: 0 });
    }

    function handleGuestAdd(song) {
      if (!song || !song.uri) return;
      if (!guestRequested.some(function(s){ return s.uri === song.uri; })) {
        guestRequested.push({
          uri: song.uri,
          title: song.title,
          artist: song.artist || '',
          art: song.art || '',
          added_by: song.addedBy || song.added_by || 'guest',
        });
      }
      if (spotifyToken && !spotifyQueueList.some(function(x){ return x.uri === song.uri; })) {
        spotifyQueueList.push({
          uri: song.uri,
          title: song.title,
          artist: song.artist || '',
          art: song.art || '',
        });
        lastSpotifyQueueSig = '';
        renderQueue();
      }
      if (spotifyToken) {
        spotifyApiFetch(
          'https://api.spotify.com/v1/me/player/queue?uri=' + encodeURIComponent(song.uri),
          { method: 'POST' }
        ).then(function(){ setTimeout(fetchSpotifyQueue, 800); }).catch(function(){});
      }
      publishBloomState();
      toast((song.addedBy || 'A guest') + ' added "' + song.title + '"');
    }

    function startBloomBus() {
      if (!bloomSessionId || bloomBus || typeof mqtt === 'undefined') return;
      let urlIndex = 0;
      function connect() {
        const url = BLOOM_MQTT_URLS[urlIndex];
        bloomBus = mqtt.connect(url, {
          clientId: 'host-' + bloomSessionId.slice(0, 8) + '-' + Math.random().toString(16).slice(2, 8),
          clean: true,
          reconnectPeriod: 3000,
        });
        bloomBus.on('connect', function(){
          bloomBus.subscribe(bloomTopic() + '/add');
          publishBloomState();
        });
        bloomBus.on('message', function(topic, payload){
          if (String(topic).indexOf('/add') === -1) return;
          try { handleGuestAdd(JSON.parse(payload.toString())); } catch(e) {}
        });
        bloomBus.on('error', function(){
          if (urlIndex < BLOOM_MQTT_URLS.length - 1 && bloomBus) {
            try { bloomBus.end(true); } catch(e) {}
            bloomBus = null;
            urlIndex += 1;
            connect();
          }
        });
      }
      connect();
    }

    async function createBloomSession(refreshToken) {
        try {
            const payload = refreshToken
                ? { refreshToken }
                : { accessToken: spotifyToken };
            const r = await fetch('/api/session-create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            const data = await r.json().catch(() => ({}));
            if (!r.ok || !data.sessionId) {
                bloomSessionId = (data && data.sessionId) || (Math.random().toString(36).slice(2, 9) + Math.random().toString(36).slice(2, 9));
                sessionStorage.setItem('bloom_session_id', bloomSessionId);
                localStorage.setItem('bloom_session_id', bloomSessionId);
                showPersistentQR(bloomSessionId);
                toast('Session error: ' + (data.error || r.status));
                return;
            }
            bloomSessionId = data.sessionId;
            sessionStorage.setItem('bloom_session_id', bloomSessionId);
            localStorage.setItem('bloom_session_id', bloomSessionId);
            toast(data.warning ? 'Session ready — queue sync may be limited' : 'Session ready ✨');
            showPersistentQR(bloomSessionId);
            fetchGuestQueue();
            subscribeGuestQueue();
            startSessionSync();
        } catch(e) {
            toast('Could not start session — check console');
        }
    }
 
    async function fetchGuestQueue() {
        if (!SUPABASE_URL || !bloomSessionId) return;
        try {
            const r = await fetch(
                `${SUPABASE_URL}/rest/v1/${QUEUE_TABLE}?session_id=eq.${bloomSessionId}&select=*&order=created_at.asc`,
                { headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}` } }
            );
            if (!r.ok) return;
            const rows = await r.json();
            guestQueueItems = rows;
            renderGuestQueue();
        } catch(e) {}
    }
 
    function renderGuestQueue() {
        if (spotifyToken) return;
        // Rebuild from Supabase, deduplicate by uri
        const seen = new Set();
        songs = guestQueueItems.filter(function(row) {
            if (!row.uri || seen.has(row.uri)) return false;
            seen.add(row.uri);
            return true;
        }).map(function(row) {
            return {
                id: row.id || row.uri,
                uri: row.uri,
                title: row.title,
                artist: row.artist || '',
                art: row.art || '',
                dur: row.dur || '',
                votes: row.votes || 0,
                by: row.added_by || 'guest',
            };
        });
        renderQueue();
    }
 
    let _guestQueueWs = null;
    function subscribeGuestQueue() {
        if (!SUPABASE_URL || !bloomSessionId) return;
        if (!SUPABASE_URL || !bloomSessionId) return;
        const wsUrl = SUPABASE_URL.replace('https://', 'wss://').replace('http://', 'ws://');
        if (_guestQueueWs) { try { _guestQueueWs.onclose = null; _guestQueueWs.close(); } catch(e){} _guestQueueWs = null; }
        const ws = new WebSocket(`${wsUrl}/realtime/v1/websocket?apikey=${SUPABASE_ANON}&vsn=1.0.0`);
        _guestQueueWs = ws;
        ws.onopen = () => {
            ws.send(JSON.stringify({
                topic: 'realtime:*',
                event: 'phx_join',
                payload: {
                    config: {
                        postgres_changes: [{ event: '*', schema: 'public', table: QUEUE_TABLE, filter: `session_id=eq.${bloomSessionId}` }]
                    }
                },
                ref: '1',
            }));
        };
        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            const evt = msg.payload?.data?.type || msg.event;
            if (evt === 'INSERT') {
                const row = msg.payload?.data?.record || msg.payload?.record;
                if (row) {
                    toast(`🌸 ${row.added_by || 'A guest'} added "${row.title}"`);
                    fetchGuestQueue();
                    // If Spotify is connected, also queue it there
                    if (spotifyToken && row.uri) {
                        spotifyApiFetch(
                            `https://api.spotify.com/v1/me/player/queue?uri=${encodeURIComponent(row.uri)}`,
                            { method: 'POST' }
                        ).catch(() => {});
                    }
                }
            }
            // heartbeat handled by interval
        };
        ws.onclose = () => setTimeout(subscribeGuestQueue, 3000);
    }

    // ── Auto-clear played songs from Supabase ─────────────
    // Called whenever now-playing changes. Calls /api/queue-remove
    // (which uses the service key) to delete it from Supabase,
    // so it vanishes from every guest screen instantly.
    let lastClearedUri = null;
    function clearPlayedSongFromQueue(uri) {
        if (!uri) return;
        if (uri === lastClearedUri) return;
        lastClearedUri = uri;
        fetch('/api/queue-remove', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ uri, sessionId: bloomSessionId }),
        }).catch(() => {});
    }
 
 
    // ── Init ───────────────────────────────────────────────
    (async function init(){
        await handleOAuthCallback();
        if(!spotifyToken){
            const hash = window.location.hash.slice(1);
            const p = new URLSearchParams(hash);
            const t = p.get('access_token');
            if(t){
                spotifyToken = t;
                sessionStorage.setItem('spotify_access_token', t);
                const rt = p.get('refresh_token');
                if (rt) sessionStorage.setItem('spotify_refresh_token', rt);
                cleanOAuthUrl();
            }
        }
        if(!spotifyToken) spotifyToken = sessionStorage.getItem('spotify_access_token');

        // If we have a Spotify token but no Bloom session, create one.
        // Use refresh token if available, otherwise the access token.
        if (spotifyToken && !bloomSessionId) {
            const rt = sessionStorage.getItem('spotify_refresh_token');
            await createBloomSession(rt || null);
        }

        loadBloomHiddenQueueUris();
        render();
        startNowPlayingOrDemo();
        if (bloomSessionId) showPersistentQR(bloomSessionId);
        fetchGuestQueue();
        subscribeGuestQueue();
        startSessionSync();

    })();
</script>
