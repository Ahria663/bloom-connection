<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://use.typekit.net/ksx6sxr.css">
    <title>Peanut Butter & Jam</title>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        :root{
            --rose:#f4a0b0;--rose-light:#fde8ed;--rose-deep:#d95c74;
            --blush:#fdf0f3;--cream:#fefaf7;--petal:#f9e4ec;--lavender:#ede6f7;
            --text-dark:#2d1a22;--text-mid:#7a4a5c;--text-soft:#c09aaa;
            --glass:rgba(255,255,255,0.72);--glass-border:rgba(244,160,176,0.35);
            --green:#1DB954;
        }
        body{font-family:'Georgia',serif;background:var(--blush);color:var(--text-dark);min-height:100vh;overflow-x:hidden;}
        body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 10%,rgba(244,160,176,0.22) 0%,transparent 55%),radial-gradient(ellipse at 80% 80%,rgba(237,230,247,0.28) 0%,transparent 55%),radial-gradient(ellipse at 60% 30%,rgba(249,228,236,0.18) 0%,transparent 45%);pointer-events:none;z-index:0;}
 
        /* typography */
        .font-serif{font-family:'Georgia',serif;}
        .font-sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
 
        /* layout */
        .app{max-width:480px;margin:0 auto;padding:24px 16px 110px;position:relative;z-index:1;}
 
        /* header */
        .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;animation:fadeUp .5s ease both;}
        .logo{font-size:28px;font-weight:700;letter-spacing:-.5px;color:var(--text-dark);}
        .logo.logo-brand{font-family:'plunct',sans-serif;font-weight:400;font-style:normal;}
        .logo span{font-size:22px;margin-left:4px;}
        .logo-sub{font-size:11px;color:var(--text-soft);margin-top:1px;letter-spacing:.5px;font-family:-apple-system,sans-serif;}
        .header-right{display:flex;gap:10px;align-items:center;}
        .spotify-badge{display:flex;align-items:center;gap:6px;background:rgba(29,185,84,.1);border:1px solid rgba(29,185,84,.25);border-radius:20px;padding:6px 12px;font-family:-apple-system,sans-serif;font-size:12px;color:var(--green);font-weight:500;}
        .dot-pulse{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
        .icon-btn{background:var(--glass);backdrop-filter:blur(12px);border:1.5px solid var(--glass-border);border-radius:14px;width:42px;height:42px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;transition:all .2s;color:var(--rose-deep);}
        .icon-btn:hover{background:var(--rose-light);}
 
        /* now playing */
        .now-playing{background:linear-gradient(135deg,var(--rose-light) 0%,var(--lavender) 100%);border-radius:22px;padding:18px 20px;margin-bottom:22px;border:1px solid var(--glass-border);position:relative;overflow:hidden;animation:fadeUp .5s .1s both;}
        .np-glow{position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:rgba(244,160,176,.18);pointer-events:none;}
        .np-inner{display:flex;align-items:center;gap:14px;position:relative;}
        .np-art{width:62px;height:62px;border-radius:14px;object-fit:cover;flex-shrink:0;border:2px solid rgba(255,255,255,.7);background:linear-gradient(135deg,var(--rose),var(--rose-deep));}
        .np-art-placeholder{width:62px;height:62px;border-radius:14px;flex-shrink:0;background:linear-gradient(135deg,var(--rose),var(--rose-deep));display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid rgba(255,255,255,.7);}
        .np-label{font-size:10px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;color:var(--rose-deep);background:rgba(224,96,122,.1);padding:2px 8px;border-radius:20px;display:inline-block;margin-bottom:5px;font-family:-apple-system,sans-serif;}
        .np-title{font-size:17px;font-weight:700;color:var(--text-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .np-artist{font-size:12px;color:var(--text-mid);margin-top:2px;font-family:-apple-system,sans-serif;}
        .eq-bars{display:flex;align-items:flex-end;gap:3px;height:22px;flex-shrink:0;}
        .eq-bar{width:4px;border-radius:3px;background:var(--rose-deep);}
        .np-progress{margin-top:14px;position:relative;}
        .np-controls{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px;position:relative;z-index:1;}
        .np-ctrl{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(217,92,116,.35);background:rgba(255,255,255,.55);color:var(--rose-deep);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s,box-shadow .15s;padding:0;}
        .np-ctrl:hover{background:var(--rose-light);transform:scale(1.06);box-shadow:0 4px 14px rgba(217,92,116,.18);}
        .np-ctrl:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
        .np-ctrl.play{width:48px;height:48px;background:linear-gradient(135deg,var(--rose),var(--rose-deep));border:none;color:#fff;box-shadow:0 6px 18px rgba(217,92,116,.28);}
        .np-ctrl.play:hover{background:linear-gradient(135deg,var(--rose-deep),var(--rose));}
        .progress-track{height:4px;background:rgba(224,96,122,.15);border-radius:4px;overflow:hidden;}
        .progress-fill{height:100%;background:linear-gradient(90deg,var(--rose),var(--rose-deep));border-radius:4px;}
        .progress-times{display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:var(--text-soft);font-family:-apple-system,sans-serif;}
 
        /* queue section */
        .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
        .section-title{font-size:18px;font-weight:700;color:var(--text-dark);}
        .section-hint{font-size:11px;color:var(--text-soft);font-family:-apple-system,sans-serif;font-style:italic;}
 
        /* song card */
        .song-card{display:flex;align-items:center;gap:12px;background:var(--glass);backdrop-filter:blur(10px);border-radius:16px;padding:11px 14px;border:1px solid var(--glass-border);transition:transform .2s,box-shadow .2s;cursor:default;margin-bottom:10px;}
        .song-card:hover{transform:translateX(4px);box-shadow:0 6px 24px rgba(244,160,176,.22);}
        .song-card.top{background:linear-gradient(135deg,var(--rose-light),var(--petal));border-color:rgba(224,96,122,.22);box-shadow:0 4px 20px rgba(224,96,122,.12);}
        .song-card.guest{background:linear-gradient(135deg,#f2c4ce,#e8a0b0);border-color:rgba(200,80,110,.35);box-shadow:0 4px 18px rgba(200,80,110,.18);}
        .song-card.guest .song-title{color:#2d1a22;}
        .song-card.guest .song-meta{color:#7a4a5c;}
        .song-rank{font-size:12px;font-weight:600;color:var(--text-soft);min-width:18px;text-align:center;font-family:-apple-system,sans-serif;}
        .song-art{width:46px;height:46px;border-radius:10px;object-fit:cover;flex-shrink:0;background:linear-gradient(135deg,var(--rose),var(--lavender));}
        .song-art-ph{width:46px;height:46px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,var(--rose),var(--lavender));display:flex;align-items:center;justify-content:center;font-size:18px;}
        .song-info{flex:1;min-width:0;}
        .song-title{font-size:14px;font-weight:600;color:var(--text-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .song-meta{font-size:11px;color:var(--text-soft);margin-top:2px;font-family:-apple-system,sans-serif;}
        .vote-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;}
        .vote-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid rgba(244,160,176,.5);background:transparent;cursor:pointer;font-size:15px;color:var(--rose-deep);transition:all .2s;display:flex;align-items:center;justify-content:center;}
        .vote-btn:hover{background:var(--rose-light);}
        .vote-btn.voted{background:var(--rose);border-color:var(--rose);color:#fff;}
        .vote-count{font-size:11px;font-weight:600;color:var(--rose-deep);font-family:-apple-system,sans-serif;}
        .remove-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(122,74,92,.22);background:transparent;cursor:pointer;font-size:20px;line-height:1;color:var(--text-soft);transition:all .2s;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;font-family:-apple-system,sans-serif;}
        .remove-btn:hover{background:rgba(224,96,122,.12);color:var(--rose-deep);border-color:rgba(224,96,122,.35);}
 
        /* FABs */
        .fab-qr{background:var(--glass);backdrop-filter:blur(16px);border:1.5px solid var(--glass-border);border-radius:18px;padding:11px 18px;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 4px 24px rgba(244,160,176,.25);transition:all .2s;font-family:-apple-system,sans-serif;font-size:12px;font-weight:500;color:var(--text-mid);}
        .fab-qr:hover{box-shadow:0 8px 32px rgba(244,160,176,.4);}
        .fab-add{position:fixed;bottom:24px;right:24px;z-index:50;background:linear-gradient(135deg,var(--rose),var(--rose-deep));border:none;border-radius:20px;padding:14px 24px;cursor:pointer;display:flex;align-items:center;gap:8px;color:#fff;font-family:-apple-system,sans-serif;font-weight:600;font-size:14px;box-shadow:0 8px 28px rgba(212,90,110,.38);transition:all .2s;}
        .fab-add:hover{transform:scale(1.04);}

        /* Session QR — pinned to the corner of this page, not a modal or side panel */
        .session-qr{display:none;position:fixed;bottom:24px;left:24px;right:auto;z-index:60;text-align:center;cursor:pointer;transition:left .3s ease,right .3s ease,bottom .3s ease;}
        .session-qr.is-on{display:block;}
        .session-qr-card{background:var(--glass);backdrop-filter:blur(16px);border:1.5px solid var(--glass-border);border-radius:18px;padding:10px;box-shadow:0 6px 24px rgba(244,160,176,.28);transition:box-shadow .2s,transform .2s;}
        .session-qr:hover .session-qr-card{box-shadow:0 8px 32px rgba(244,160,176,.4);transform:translateY(-1px);}
        .session-qr-mount{width:120px;height:120px;border-radius:12px;overflow:hidden;background:var(--blush);}
        .session-qr-mount canvas,.session-qr-mount img{display:block;width:120px;height:120px;border-radius:12px;}
        .session-qr-label{margin-top:6px;font-family:-apple-system,sans-serif;font-size:10px;font-weight:500;letter-spacing:.35px;color:var(--text-soft);}
        .session-qr.is-pulse .session-qr-card{animation:qrPulse .7s ease;}
        @keyframes qrPulse{0%,100%{box-shadow:0 6px 24px rgba(244,160,176,.28);}40%{box-shadow:0 0 0 6px rgba(244,160,176,.35),0 8px 32px rgba(244,160,176,.4);}}
        body.lyrics-mode .session-qr,
        .session-qr.is-lyrics{left:auto;right:24px;bottom:100px;}
        @media (max-width:560px){
            .session-qr{bottom:88px;left:12px;}
            .session-qr-mount,.session-qr-mount canvas,.session-qr-mount img{width:96px;height:96px;}
            body.lyrics-mode .session-qr,
            .session-qr.is-lyrics{left:auto;right:12px;bottom:88px;}
        }
 
        /* modal overlay */
        .overlay{position:fixed;inset:0;background:rgba(45,26,34,.45);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn .25s ease;}
        .modal-card{background:var(--cream);border-radius:28px;padding:36px;max-width:320px;width:90%;box-shadow:0 24px 64px rgba(45,26,34,.18);border:1px solid var(--glass-border);text-align:center;animation:popIn .3s ease;}
        .modal-title{font-size:22px;font-weight:700;color:var(--text-dark);margin-bottom:6px;}
        .modal-sub{font-size:13px;color:var(--text-soft);line-height:1.6;font-family:-apple-system,sans-serif;margin-bottom:22px;}
 
        /* bottom sheet */
        .sheet-overlay{position:fixed;inset:0;background:rgba(45,26,34,.45);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .25s ease;}
        .sheet{background:var(--cream);border-radius:28px 28px 0 0;padding:24px;width:100%;max-width:500px;box-shadow:0 -16px 48px rgba(45,26,34,.15);animation:slideUp .3s ease;padding-bottom:36px;}
        .sheet-handle{width:40px;height:4px;background:rgba(244,160,176,.4);border-radius:4px;margin:0 auto 20px;}
        .sheet-title{font-size:20px;font-weight:700;color:var(--text-dark);margin-bottom:16px;}
        .search-wrap{position:relative;margin-bottom:14px;}
        .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-soft);font-size:15px;}
        .search-input{width:100%;padding:12px 14px 12px 40px;border:1.5px solid var(--glass-border);border-radius:14px;font-family:-apple-system,sans-serif;font-size:14px;background:var(--blush);color:var(--text-dark);outline:none;transition:border-color .2s;}
        .search-input:focus{border-color:var(--rose);}
        .results-list{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;}
        .result-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--blush);border-radius:14px;cursor:pointer;border:1px solid var(--glass-border);transition:background .2s;}
        .result-item:hover{background:var(--rose-light);}
        .result-item.added-flash{background:linear-gradient(135deg,var(--rose-light),var(--petal));}
        .result-art{width:42px;height:42px;border-radius:8px;flex-shrink:0;background:linear-gradient(135deg,var(--rose),var(--lavender));display:flex;align-items:center;justify-content:center;font-size:16px;}
        .result-title{font-size:14px;font-weight:600;color:var(--text-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .result-artist{font-size:12px;color:var(--text-soft);font-family:-apple-system,sans-serif;}
        .result-dur{font-size:12px;color:var(--text-soft);flex-shrink:0;font-family:-apple-system,sans-serif;}
 
        /* QR container */
        .qr-box{display:inline-block;padding:14px;background:var(--blush);border-radius:16px;margin-bottom:18px;border:1px solid var(--glass-border);}
        .qr-box canvas{display:block;border-radius:12px;max-width:100%;height:auto;}
        .qr-fallback{font-size:12px;color:var(--text-soft);font-family:-apple-system,sans-serif;padding:12px;}
 
        /* connect button */
        .spotify-connect{background:var(--green);color:#fff;border:none;border-radius:32px;padding:13px 28px;font-family:-apple-system,sans-serif;font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(29,185,84,.32);transition:transform .15s;margin:0 auto 8px;}
        .spotify-connect:hover{transform:scale(1.03);}
        .spotify-note{font-size:11px;color:var(--text-soft);font-family:-apple-system,sans-serif;font-style:italic;}
 
        /* close btn */
        .close-btn{background:var(--rose);color:#fff;border:none;border-radius:20px;padding:10px 28px;font-family:-apple-system,sans-serif;font-weight:600;font-size:13px;cursor:pointer;transition:all .2s;}
        .close-btn:hover{background:var(--rose-deep);}
 
        /* toast */
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;border-radius:20px;padding:10px 22px;font-size:13px;font-weight:500;box-shadow:0 8px 28px rgba(212,90,110,.38);animation:popIn .3s ease;white-space:nowrap;font-family:-apple-system,sans-serif;}
 
        /* empty state */
        .empty{text-align:center;padding:40px 20px;color:var(--text-soft);font-family:-apple-system,sans-serif;font-size:14px;}
 
        /* spotify connect banner */
        .connect-banner{background:var(--glass);backdrop-filter:blur(10px);border:1.5px dashed var(--glass-border);border-radius:16px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;animation:fadeUp .5s .2s both;}
        .connect-text{font-size:13px;color:var(--text-mid);font-family:-apple-system,sans-serif;line-height:1.5;}
        .connect-text strong{color:var(--text-dark);}
 
        /* animations */
        @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
        @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
        @keyframes popIn{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:scale(1);}}
        @keyframes slideUp{from{opacity:0;transform:translateY(40px);}to{opacity:1;transform:translateY(0);}}
        @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
        @keyframes eq1{0%,100%{height:6px;}50%{height:18px;}}
        @keyframes eq2{0%,100%{height:12px;}50%{height:6px;}}
        @keyframes eq3{0%,100%{height:8px;}50%{height:16px;}}
        @keyframes eq4{0%,100%{height:16px;}50%{height:8px;}}
        @keyframes eq5{0%,100%{height:10px;}50%{height:20px;}}
        @keyframes cardIn{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
        .eq-bars.np-paused .eq-bar{animation-play-state:paused;opacity:.45;}

        /* ── split layout when lyrics are open ── */
        body.lyrics-mode .app{max-width:480px;margin:0;position:relative;z-index:1;}
        .split-lyrics-panel{display:none;position:fixed;top:0;bottom:0;right:0;width:calc(100vw - 480px);min-width:300px;flex-direction:column;padding:28px 28px 32px;background:var(--blush);border-left:1px solid var(--glass-border);z-index:10;overflow:hidden;}
        body.lyrics-mode .split-lyrics-panel{display:flex;}
        body.lyrics-mode{overflow-x:hidden;}

        /* lyrics karaoke */
        .lyrics-karaoke{flex:1;overflow:hidden;position:relative;mask-image:linear-gradient(to bottom,transparent 0%,black 15%,black 75%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,transparent 0%,black 15%,black 75%,transparent 100%);}
        .lyrics-scroll{display:flex;flex-direction:column;align-items:flex-start;padding:40vh 0;transition:transform .6s cubic-bezier(.22,1,.36,1);}
        .lyric-line{font-family:'Georgia',serif;font-size:22px;font-weight:700;line-height:1.5;color:var(--text-soft);opacity:0.35;transition:all .5s ease;cursor:default;padding:4px 0;text-align:left;}
        .lyric-line.active{color:var(--text-dark);opacity:1;font-size:26px;transform:scale(1.04);transform-origin:left center;}
        .lyric-line.past{opacity:0.2;}
        .lyric-line.next{opacity:0.5;}
        .lyric-line.empty{height:16px;}
        .lyrics-status{font-family:-apple-system,sans-serif;font-size:12px;color:var(--text-soft);margin-bottom:12px;display:flex;align-items:center;gap:6px;font-style:italic;}
        .lyrics-toggle-btn{background:transparent;border:1px solid rgba(217,92,116,.3);border-radius:20px;padding:3px 10px;font-family:-apple-system,sans-serif;font-size:10px;font-weight:600;color:var(--rose-deep);cursor:pointer;letter-spacing:.5px;transition:all .2s;margin-top:6px;display:inline-flex;align-items:center;gap:4px;}
        .lyrics-toggle-btn:hover{background:var(--rose-light);}
        .lyrics-toggle-btn.active-btn{background:var(--rose-light);}
    </style>
</head>
<body>
 
<div class="app" id="app">
 
    <!-- HEADER -->
    <div class="header">
        <div>
            <div class="logo logo-brand">Peanut Butter & Jam</div>
            <div class="logo-sub font-sans">collaborative playlist</div>
        </div>
        <div class="header-right" id="headerRight">
            <!-- injected by JS -->
        </div>
    </div>
 
    <!-- NOW PLAYING -->
    <div class="now-playing" id="nowPlaying">
        <div class="np-glow"></div>
        <div class="np-inner">
            <div class="np-art-placeholder" id="npArtPh" style="display:none;" aria-hidden="true">🎵</div>
            <img class="np-art" id="npArt" src="https://i.scdn.co/image/ab67616d0000b2737fd8b0ca78c0c7a44dbcbe04" alt="album art" onerror="this.style.display='none';var p=document.getElementById('npArtPh');if(p)p.style.display='flex'" />
            <div style="flex:1;min-width:0;">
                <div class="np-label font-sans" id="npLabel">Now Playing</div>
                <div class="np-title font-serif" id="npTitle">Von Dutch</div>
                <div class="np-artist font-sans" id="npArtist">Charli XCX · Brat</div>
            </div>
            <div class="eq-bars" id="npEqBars">
                <div class="eq-bar" style="animation:eq1 .7s ease-in-out infinite;"></div>
                <div class="eq-bar" style="animation:eq2 .6s ease-in-out infinite;"></div>
                <div class="eq-bar" style="animation:eq3 .8s ease-in-out infinite;"></div>
                <div class="eq-bar" style="animation:eq4 .65s ease-in-out infinite;"></div>
                <div class="eq-bar" style="animation:eq5 .75s ease-in-out infinite;"></div>
            </div>
        </div>
        <div class="np-progress">
            <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:42%;"></div></div>
            <div class="progress-times"><span id="progressTime">1:14</span><span id="progressTotal">2:50</span></div>
        </div>
        <div class="np-controls" id="npControls">
            <button type="button" class="np-ctrl" id="npPrev" onclick="playerPrev()" title="Previous" aria-label="Previous">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6V6zm3.5 6 8.5 6V6l-8.5 6z"/></svg>
            </button>
            <button type="button" class="np-ctrl play" id="npPlay" onclick="playerToggle()" title="Pause" aria-label="Pause">
                <svg id="npPlayIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7L8 5z"/></svg>
            </button>
            <button type="button" class="np-ctrl" id="npNext" onclick="playerNext()" title="Skip" aria-label="Skip">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2V6zM6 18l8.5-6L6 6v12z"/></svg>
            </button>
        </div>

            cleanOAuthUrl();
            return;
        }
        const code = params.get('code');
        if (!code) return;
        const state = params.get('state');
        if (state !== sessionStorage.getItem('spotify_oauth_state')) {
            toast('Login session expired — tap Connect again');
            cleanOAuthUrl();
            return;
        }

            return;

            code: code,
            redirect_uri: getRedirectUri(),
            client_id: id,
            code_verifier: verifier,

function normalizeSpotifyQueueItem(item){
  if(!item || !item.uri) return null;
  if(item.show || item.type === 'episode'){
    const imgs = item.images || [];
    const art = imgs.find(i => i.width >= 300)?.url || imgs[0]?.url || '';
    return {
      id: item.id,
      uri: item.uri,
      title: item.name || '—',
      artist: item.show?.name || 'Podcast',
      art,
    };
  }
  if(item.name && item.album){
    const imgs = item.album.images || [];
    const art = imgs.find(i => i.width >= 300)?.url || imgs[0]?.url || '';
    return {
      id: item.id,
      uri: item.uri,
      title: item.name,
      artist: (item.artists || []).map(a => a.name).join(', '),
      art,
    };
  }
  return null;
}
 
function spotifyQueueSignature(list){
  return list.map(x => x.uri).join('\x1e');
}
 
async function fetchSpotifyQueue(){
  if(!spotifyToken) return;
  try{
    const r = await spotifyApiFetch('https://api.spotify.com/v1/me/player/queue',{});
    if(r.status === 204 || r.status === 404){
      if(lastSpotifyQueueSig === '' && spotifyQueueList.length === 0) return;
      lastSpotifyQueueSig = '';
      spotifyQueueList = [];
      pruneBloomHiddenQueueUris(spotifyQueueList);
      renderQueue();
      return;
    }
    if(!r.ok){
      if(lastSpotifyQueueSig === '' && spotifyQueueList.length === 0) return;
      lastSpotifyQueueSig = '';
      spotifyQueueList = [];
      pruneBloomHiddenQueueUris(spotifyQueueList);
      renderQueue();
      return;
    }
    const data = await r.json();
    const curFromQueue = data.currently_playing?.uri;
    const curUri = curFromQueue || nowPlayingTrackUri;
    const raw = data.queue || [];
    const newList = raw
      .map(normalizeSpotifyQueueItem)
      .filter(Boolean)
      .filter(x => x.uri !== curUri);
    const sig = spotifyQueueSignature(newList);
    if(sig === lastSpotifyQueueSig) return;
    lastSpotifyQueueSig = sig;
    spotifyQueueList = newList;
    pruneBloomHiddenQueueUris(newList);
    renderQueue();
  } catch(e){
    if(lastSpotifyQueueSig === '' && spotifyQueueList.length === 0) return;
    lastSpotifyQueueSig = '';
    spotifyQueueList = [];
    pruneBloomHiddenQueueUris(spotifyQueueList);
    renderQueue();
  }
}
 
function renderQueue(){

    const n = visible.length;
    const apiN = spotifyQueueList.length;
    const paintSig = spotifyQueuePaintSig();
    if(el.getAttribute('data-queue-sig') === paintSig) return;
    el.setAttribute('data-queue-sig', paintSig);
    document.getElementById('queueCount').textContent = n ? `${n} upcoming` : (apiN ? 'all hidden' : '');
    if(apiN === 0){
      el.innerHTML = '<div class="empty">Nothing queued yet — add a song or keep listening in Spotify 🌸</div>';
      return;
    }
    if(n === 0){
      el.innerHTML = '<div class="empty">Every upcoming track is hidden in Bloom. They can still play in Spotify — clear them in the Spotify app, or wait until the queue changes.</div>';
      return;
    }
    el.innerHTML = visible.map((s,i)=>`
        <div class="song-card ${i===0?'top':''}">
            <span class="song-rank font-sans">#${i+1}</span>
        ${s.art ? `<img class="song-art" src="${s.art}" alt="" onerror="this.outerHTML='<div class=\\'song-art-ph\\'>🎵</div>'" />` : `<div class="song-art-ph">🎵</div>`}
        <div class="song-info">
            <div class="song-title font-serif">${esc(s.title)}</div>
            <div class="song-meta font-sans">${esc(s.artist)}</div>
        </div>
        <button type="button" class="remove-btn" data-queue-rm="${escAttr(s.uri)}" onclick="removeSpotifyQueueRow(this.getAttribute('data-queue-rm'))" title="Remove from Bloom list (Spotify may still play this track)" aria-label="Remove from Bloom list">×</button>
    </div>`).join('');
    return;
  }
  el.removeAttribute('data-queue-sig');
  if(hint) hint.textContent = 'sorted by votes ♥';
  const sorted = [...songs].sort((a,b)=>b.votes-a.votes);
  document.getElementById('queueCount').textContent = `${sorted.length} songs`;
  if(!sorted.length){ el.innerHTML='<div class="empty">No songs yet — add the first one! 🌸</div>'; return; }
  el.innerHTML = sorted.map((s,i)=>`
        <div class="song-card ${i===0?'top':''}${s.by&&s.by!==''?' guest':''}" style="animation:cardIn .35s ${i*0.05}s both;">
            <span class="song-rank font-sans">#${i+1}</span>
        ${s.art ? `<img class="song-art" src="${s.art}" alt="" onerror="this.outerHTML='<div class=\\'song-art-ph\\'>🎵</div>'" />` : `<div class="song-art-ph">🎵</div>`}
        <div class="song-info">
            <div class="song-title font-serif">${esc(s.title)}</div>
            <div class="song-meta">${esc(s.artist)} · ${esc(s.by||'')}</div>
        </div>
        <button type="button" class="remove-btn" data-sid="${escAttr(s.id)}" onclick="removeSong(this.dataset.sid)" title="Remove from queue" aria-label="Remove from queue">×</button>
        <div class="vote-col">
            <button type="button" class="vote-btn ${votedIds.has(s.id)?'voted':''}" onclick="vote('${escIdJs(s.id)}')">♥</button>
            <span class="vote-count font-sans">${s.votes}</span>
        </div>
    </div>`).join('');
  if(lyricsOpen){
    clearTimeout(window._syncQueueTimer);
    window._syncQueueTimer = setTimeout(syncSplitQueue, 200);
  }
}

function removeSong(id){

function applyNpProgress(progressMs, durationMs){

let currentLyricsTrack = null;
let lyricsOpen = false;
let lyricsLines = [];
let lyricsActiveIdx = -1;
let lyricsTickTimer = null;

// lyricsLines now stores {time, text} objects for timestamped sync
// time is in seconds (from lrclib), text is the lyric line
let lastLyricsFetch = '';
let lyricsTimestamped = false; // true if we have real timestamps

async function fetchLyricsKaraoke(title, artist){
  if(!title || !artist) return;
  const key = title + '||' + artist;

  const status = document.getElementById('lyricsStatus');
  const scroll = document.getElementById('lyricsScroll');

  if(status) status.textContent = '\u266a ' + title + ' \u2014 ' + artist;

  if(key === lastLyricsFetch) return;
  lastLyricsFetch = key;
  lyricsLines = [];
  lyricsActiveIdx = -1;
  lyricsTimestamped = false;
  clearInterval(lyricsTickTimer);
  if(scroll) scroll.innerHTML = '<div style="color:var(--text-soft);font-family:-apple-system,sans-serif;font-size:13px;padding:8px 0;">Loading lyrics\u2026</div>';

  const cleanTitle  = title.replace(/\s*[\(\[].*?[\)\]]/g, '').trim();
  const cleanArtist = artist.split(',')[0].trim();

  // Try lrclib first — has real timestamps
  try {
    const dur = npLast ? Math.round(npLast.duration_ms / 1000) : 0;
    const lrcUrl = 'https://lrclib.net/api/get?track_name=' + encodeURIComponent(cleanTitle) +
      '&artist_name=' + encodeURIComponent(cleanArtist) +
      (dur ? '&duration=' + dur : '');
    const r = await fetch(lrcUrl);
    if(r.ok){
      const data = await r.json();
      // syncedLyrics has timestamps: [mm:ss.xx] line text
      const lrc = data.syncedLyrics || data.plainLyrics || '';
      if(lrc && data.syncedLyrics){
        // Parse LRC format: [00:12.34] Some lyric line
        const lrcLines = data.syncedLyrics.split('\n');
        lyricsLines = [];
        for(const line of lrcLines){
          const m = line.match(/^\[(\d+):(\d+\.?\d*)\](.*)$/);
          if(m){
            const secs = parseInt(m[1])*60 + parseFloat(m[2]);
            const text = m[3].trim();
            lyricsLines.push({ time: secs, text });
          }
        }
        lyricsLines.sort(function(a,b){ return a.time - b.time; });
        lyricsTimestamped = true;
        if(status) status.textContent = '\u266a ' + title + ' \u2014 ' + artist;
        renderLyricsLines();
        startLyricsTick();
        return;
      } else if(lrc && data.plainLyrics){
        // Fallback: plain lyrics, use progress estimation
        const raw = data.plainLyrics.trim().split('\n');
        lyricsLines = [];
        let blankRun = 0;
        for(const line of raw){
          const t = line.trim();
          if(!t){ blankRun++; if(blankRun <= 1) lyricsLines.push({time:-1, text:''}); }
          else { blankRun = 0; lyricsLines.push({time:-1, text:t}); }
        }
        renderLyricsLines();
        startLyricsTick();
        return;
      }
    }
  } catch(e) {}

  // Fallback: lyrics.ovh
  try {
    const ovhUrl = 'https://api.lyrics.ovh/v1/' + encodeURIComponent(cleanArtist) + '/' + encodeURIComponent(cleanTitle);
    const r2 = await fetch(ovhUrl);
    if(r2.ok){
      const data2 = await r2.json();
      if(data2.lyrics){
        const raw = data2.lyrics.trim().split('\n');
        lyricsLines = [];
        let blankRun = 0;
        for(const line of raw){
          const t = line.trim();
          if(!t){ blankRun++; if(blankRun <= 1) lyricsLines.push({time:-1, text:''}); }
          else { blankRun = 0; lyricsLines.push({time:-1, text:t}); }
        }
        renderLyricsLines();
        startLyricsTick();
        return;
      }
    }
  } catch(e) {}

  // Nothing found
  if(scroll) scroll.innerHTML = '<div style="color:var(--text-soft);font-family:-apple-system,sans-serif;font-size:13px;padding:8px 0;line-height:1.8;">Lyrics not found<br><a href="https://genius.com/search?q=' + encodeURIComponent(title+' '+artist) + '" target="_blank" style="color:var(--rose-deep);font-size:12px;">Search on Genius \u2197</a></div>';
}

function renderLyricsLines(){
  const scroll = document.getElementById('lyricsScroll');
  if(!scroll) return;
  scroll.innerHTML = lyricsLines.map(function(line, i){
    if(!line.text) return '<div class="lyric-line empty" data-idx="' + i + '"></div>';
    return '<div class="lyric-line" data-idx="' + i + '">' + esc(line.text) + '</div>';
  }).join('');
}

function startLyricsTick(){
  clearInterval(lyricsTickTimer);
  lyricsTickTimer = setInterval(tickLyrics, 100);
}

function tickLyrics(){
  if(!lyricsLines.length || !npLast) return;
  const prog = npLast.is_playing
    ? Math.min(npLast.progress_ms + (Date.now() - npLast.fetchedAt), npLast.duration_ms)
    : npLast.progress_ms;
  const progSecs = prog / 1000;

  let lineIdx = 0;
  if(lyricsTimestamped){
    // Real timestamps — find the last line whose time <= current position
    for(let i = lyricsLines.length - 1; i >= 0; i--){
      if(lyricsLines[i].time <= progSecs){
        lineIdx = i;
        break;
      }
    }
  } else {
    // Estimated — spread lines evenly across duration
    const pct = prog / (npLast.duration_ms || 1);
    lineIdx = Math.min(Math.floor(pct * lyricsLines.length), lyricsLines.length - 1);
  }

  if(lineIdx === lyricsActiveIdx) return;
  lyricsActiveIdx = lineIdx;

  const scroll = document.getElementById('lyricsScroll');
  if(!scroll) return;

  const allLines = scroll.querySelectorAll('.lyric-line');
  allLines.forEach(function(el, i){
    el.classList.remove('active','past','next');
    if(i < lineIdx) el.classList.add('past');
    else if(i === lineIdx) el.classList.add('active');
    else if(i <= lineIdx + 2) el.classList.add('next');
  });

  // Smooth scroll active line to center
  const active = scroll.querySelector('.lyric-line.active');
  if(active){
    const karaoke = document.getElementById('lyricsKaraoke');
    const karaokeH = karaoke ? karaoke.offsetHeight : 400;
    const offset = active.offsetTop - (karaokeH * 0.38);
    scroll.style.transform = 'translateY(' + (-offset) + 'px)';
  }
}
 
async function getActivePlayer(){
  const r = await spotifyApiFetch('https://api.spotify.com/v1/me/player', {});
  if(r.status === 204 || r.status === 404) return null;
  if(!r.ok) return null;
  return r.json();
}

function playerErrorToast(err){
  const msg = String(err || '');
  if(/restriction/i.test(msg)){
    toast('Spotify blocked that — Premium, an active device, and no DJ/private session');
    return;
  }
  toast(msg || 'Playback control failed');
}

async function playerCommand(path, method, deviceId){
  if(!spotifyToken){
    toast('Connect Spotify to control playback');
    return false;
  }
  try{
    let url = 'https://api.spotify.com/v1/me/player/' + path;
    if(deviceId) url += (url.includes('?') ? '&' : '?') + 'device_id=' + encodeURIComponent(deviceId);
    const r = await spotifyApiFetch(url, { method: method || 'POST' });
    if(r.status === 404){
      toast('Start playback on a Spotify device first (Premium)');
      return false;
    }
    if(!r.ok && r.status !== 204){
      const j = await r.json().catch(()=>({}));
      playerErrorToast(j.error?.message || 'Playback control failed');
      return false;
    }
    setTimeout(fetchNowPlaying, 400);
    setTimeout(fetchSpotifyQueue, 800);
    return true;
  } catch(e){
    toast('Playback control failed');
    return false;
  }
}

async function playerPrev(){
  const player = await getActivePlayer().catch(()=>null);
  await playerCommand('previous', 'POST', player && player.device && player.device.id);
}

async function playerNext(){
  const player = await getActivePlayer().catch(()=>null);
  await playerCommand('next', 'POST', player && player.device && player.device.id);
}

async function playerToggle(){
  if(!spotifyToken){
    toast('Connect Spotify to control playback');
    return;
  }
  const player = await getActivePlayer().catch(()=>null);
  if(!player || !player.device){
    toast('Start playback on a Spotify device first (Premium)');
    return;
  }
  const playing = !!player.is_playing;
  setPlayPauseIcon(!playing);
  if(npLast) npLast.is_playing = !playing;
  const ok = await playerCommand(playing ? 'pause' : 'play', 'PUT', player.device.id);
  if(!ok){
    setPlayPauseIcon(playing);
    if(npLast) npLast.is_playing = playing;
  }
}

async function fetchNowPlaying(){
  if(!spotifyToken) return;
  try{
    const r = await spotifyApiFetch('https://api.spotify.com/v1/me/player', {});
    if(r.status === 204 || r.status === 404){
      showNowPlayingIdle('Nothing playing', 'Open Spotify and press play on any device');
      return;
    }
    if(!r.ok) return;
    const data = await r.json();
    if(!data.item){
      showNowPlayingIdle('Nothing playing', 'Play a track in Spotify to see it here');
      return;
    }
    if(data.currently_playing_type === 'episode'){
      const ep = data.item;
      nowPlayingTrackUri = ep.uri || null;
      const showName = ep.show?.name || 'Podcast';
      const label = document.getElementById('npLabel');
      const eq = document.getElementById('npEqBars');
      if(label) label.textContent = data.is_playing ? 'Now Playing' : 'Paused';
      if(eq) eq.classList.toggle('np-paused', !data.is_playing);
      setPlayPauseIcon(!!data.is_playing);
      document.getElementById('npTitle').textContent = ep.name || '—';
      document.getElementById('npArtist').textContent = showName;
      const eimgs = ep.images || [];
      const eArt = eimgs.find(i => i.width >= 300)?.url || eimgs[0]?.url || '';
      setNpArt(eArt || '');
      npLast = {
        item: ep,
        progress_ms: data.progress_ms || 0,
        duration_ms: ep.duration_ms || 1,
        is_playing: !!data.is_playing,
        fetchedAt: Date.now(),
      };
      tickNowPlayingFromCache();
      return;
    }
    // If the track changed, clear the previous song from guest queue
    const incomingUri = data.item.uri || null;
    if (incomingUri && incomingUri !== nowPlayingTrackUri && nowPlayingTrackUri) {
        clearPlayedSongFromQueue(nowPlayingTrackUri);
    }
    nowPlayingTrackUri = incomingUri;
    npLast = {
      item: data.item,
      progress_ms: data.progress_ms || 0,
      duration_ms: data.item.duration_ms || 1,
      is_playing: !!data.is_playing,
      fetchedAt: Date.now(),
    };
    applySpotifyTrackToUI(data.item, !!data.is_playing);
    tickNowPlayingFromCache();
  } catch(e){}
}

async function doSearch(q){

  res.innerHTML = `<div style="text-align:center;padding:16px;color:var(--text-soft);font-size:13px;font-family:-apple-system,sans-serif;">Searching...</div>`;
 
  let results = [];
 
  if(spotifyToken){
    try{
      const r = await spotifyApiFetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(q)}&type=track&limit=7`,{});
            const data = await r.json();
        results = (data.tracks?.items||[]).map(t=>({
            id:t.id, uri:t.uri,
            title:t.name,
            artist:t.artists.map(a=>a.name).join(', '),
            dur:`${Math.floor(t.duration_ms/60000)}:${String(Math.floor((t.duration_ms%60000)/1000)).padStart(2,'0')}`,
            art: t.album.images[1]?.url || t.album.images[0]?.url || '',
        }));
    }catch(e){}
    } else {
        // demo fallback
        results = [...DEMO_SONGS, ...SEARCH_DEMOS].filter(s=>
            s.title.toLowerCase().includes(q.toLowerCase()) ||
            s.artist.toLowerCase().includes(q.toLowerCase())
        ).slice(0,6);
    }
 
    if(!res) return;
    if(!results.length){ res.innerHTML=`<div style="text-align:center;padding:16px;color:var(--text-soft);font-size:13px;font-family:-apple-system,sans-serif;">No results found 🫧</div>`; return; }
    res.innerHTML = results.map(s=>`
    <div class="result-item" id="ri-${s.id}" onclick="addSong(${JSON.stringify(s).replace(/"/g,'&quot;')})">
      ${s.art ? `<img style="width:42px;height:42px;border-radius:8px;object-fit:cover;flex-shrink:0;" src="${s.art}" alt="" onerror="this.outerHTML='<div class=\\'result-art\\'>🎵</div>'" />` : `<div class="result-art">🎵</div>`}
      <div style="flex:1;min-width:0;">
        <div class="result-title font-serif">${esc(s.title)}</div>
        <div class="result-artist">${esc(s.artist)}</div>
      </div>
      <span class="result-dur">${esc(s.dur||s.duration||'')}</span>
    </div>`).join('');
    }
 
    async function addSong(s){
        const el = document.getElementById('ri-'+s.id);
        if(el){ el.classList.add('added-flash'); el.innerHTML = el.innerHTML.replace('result-dur','result-dur').replace(s.dur||s.duration||'','✓'); }
        // add to Spotify queue
        if(spotifyToken && s.uri){
            try{
                const qr = await spotifyApiFetch(`https://api.spotify.com/v1/me/player/queue?uri=${encodeURIComponent(s.uri)}`,{method:'POST'});
                if(qr.status===404) toast('Start playback on a Spotify device first (Premium)');
                else if(!qr.ok && qr.status!==204){ const j=await qr.json().catch(()=>({})); toast(j.error?.message||'Could not add to Spotify queue'); }
            }catch(e){}
        }
        if(!spotifyToken){
            if(!songs.find(x=>x.id===s.id)){
                songs.unshift({...s,votes:1,by:'@you',emoji:s.emoji||'🎵'});
            }
        }
        toast(`"${s.title}" added to queue ♥`);
        setTimeout(async ()=>{
            closeModals();
            if(spotifyToken) await fetchSpotifyQueue();
            render();
        },800);
    }
 
    function getEmoji(title){
        const t = title.toLowerCase();
        if(t.includes('summer')||t.includes('sun')) return '☀️';
        if(t.includes('night')||t.includes('moon')) return '🌙';
        if(t.includes('love')||t.includes('heart')) return '💕';
        if(t.includes('flower')||t.includes('rose')) return '🌸';
        if(t.includes('rain')) return '🌧️';
        if(t.includes('fire')) return '🔥';
        if(t.includes('star')) return '⭐';
        if(t.includes('sky')) return '🌤️';
        const emojis=['🎵','🎶','💫','✨','🌿','🎀','🫶','🌺','🍒','🌙'];
        return emojis[Math.floor(Math.random()*emojis.length)];
    }
 
    function guestInviteUrl(sid){
        // Always the public production guest page — preview *.vercel.app URLs
        // require Vercel SSO and would force guests to log in.
        return PUBLIC_ORIGIN + '/guest.html?session=' + encodeURIComponent(sid);
    }

    function loadQRScript(){
        return new Promise((res, rej) => {
            if (typeof qrcode === 'function') return res();
            const s = document.createElement('script');
            s.src = '/vendor/qrcode.min.js';
            s.onload = () => (typeof qrcode === 'function' ? res() : rej(new Error('qr')));
            s.onerror = () => rej(new Error('qr'));
            document.head.appendChild(s);
        });
    }

    function paintQRCode(mount, text, width){
        mount.textContent = '';
        const qr = qrcode(0, 'M');
        qr.addData(text);
        qr.make();
        const cells = qr.getModuleCount();
        const size = width || 120;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        if (!ctx) throw new Error('canvas');
        const scale = size / cells;
        ctx.fillStyle = '#fdf0f3';
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = '#2d1a22';
        for (let r = 0; r < cells; r++) {
            for (let c = 0; c < cells; c++) {
                if (qr.isDark(r, c)) {
                    ctx.fillRect(Math.floor(c * scale), Math.floor(r * scale), Math.ceil(scale), Math.ceil(scale));
                }
            }
        }
        mount.appendChild(canvas);
    }

    function pulseSessionQR(){
        const wrap = document.getElementById('persistentQR');
        if (!wrap) return;
        wrap.classList.remove('is-pulse');
        void wrap.offsetWidth;
        wrap.classList.add('is-pulse');
        setTimeout(() => wrap.classList.remove('is-pulse'), 800);
    }

    async function openQR(){
        let sid = bloomSessionId || sessionStorage.getItem('bloom_session_id');
        if (!sid) {
            if (spotifyToken) {
                await startSession();
                return;
            }
            toast('Connect Spotify to start a session');
            return;
        }
        await showPersistentQR(sid);
        pulseSessionQR();
    }

    async function startSession() {
        toast('Starting session…');
        const rt = sessionStorage.getItem('spotify_refresh_token');
        await createBloomSession(rt || null);
        renderHeader();
    }

    async function showPersistentQR(sid) {
        if (!sid) return;
        const wrap = document.getElementById('persistentQR');
        const mount = document.getElementById('persistentQRMount');
        if (!wrap || !mount) return;
        const guestUrl = guestInviteUrl(sid);
        wrap.classList.add('is-on');
        placeSessionQR(lyricsOpen);
        wrap.title = 'Scan to join · click to copy invite link';
        wrap.onclick = function() {
            if (navigator.clipboard && guestUrl) {
                navigator.clipboard.writeText(guestUrl).then(() => toast('Invite link copied')).catch(() => {});
            }
        };
        try {
            await loadQRScript();
            await paintQRCode(mount, guestUrl, 120);
        } catch (e) {
            mount.textContent = '';
            const img = document.createElement('img');
            img.alt = 'Scan to add a song';
            img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=120x120&margin=1&data=' + encodeURIComponent(guestUrl);
            mount.appendChild(img);
        }
        const label = document.getElementById('persistentQRLabel');
        if (label) label.textContent = 'scan to add a song';
    }

    function closeModals(){ document.getElementById('modals').innerHTML=''; }
    function closeIfBackdrop(e,id){ if(e.target.id===id) closeModals(); }

    // ── Supabase + Sessions ────────────────────────────────
    const SUPABASE_URL  = 'https://wbtbkqczxttkntjzafgq.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndidGJrcWN6eHR0a250anphZmdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NTkzMTAsImV4cCI6MjA5MDIzNTMxMH0.81yC0IWVll9ktKJyciKnC-bsO9atFydvszES_zzo-4k';
    const QUEUE_TABLE   = 'bloom_queue';

    let bloomSessionId = sessionStorage.getItem('bloom_session_id') || localStorage.getItem('bloom_session_id') || null;
    if (bloomSessionId) {
        sessionStorage.setItem('bloom_session_id', bloomSessionId);
        localStorage.setItem('bloom_session_id', bloomSessionId);
    }
    let guestQueueItems = [];

    async function createBloomSession(refreshToken) {
        try {
            const payload = refreshToken
                ? { refreshToken }
                : { accessToken: spotifyToken };
            const r = await fetch('/api/session-create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            const data = await r.json().catch(() => ({}));
            if (!r.ok || !data.sessionId) {
                bloomSessionId = (data && data.sessionId) || (Math.random().toString(36).slice(2, 9) + Math.random().toString(36).slice(2, 9));
                sessionStorage.setItem('bloom_session_id', bloomSessionId);
                localStorage.setItem('bloom_session_id', bloomSessionId);
                showPersistentQR(bloomSessionId);
                toast('Session error: ' + (data.error || r.status));
                return;
            }
            bloomSessionId = data.sessionId;
            sessionStorage.setItem('bloom_session_id', bloomSessionId);
            localStorage.setItem('bloom_session_id', bloomSessionId);
            toast(data.warning ? 'Session ready — queue sync may be limited' : 'Session ready ✨');
            showPersistentQR(bloomSessionId);
            // Re-subscribe now that we have a session
            fetchGuestQueue();
            subscribeGuestQueue();
        } catch(e) {
            toast('Could not start session — check console');
        }
    }
 
    async function fetchGuestQueue() {
        if (!SUPABASE_URL || !bloomSessionId) return;
        try {
            const r = await fetch(
                `${SUPABASE_URL}/rest/v1/${QUEUE_TABLE}?session_id=eq.${bloomSessionId}&select=*&order=created_at.asc`,
                { headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}` } }
            );
            if (!r.ok) return;
            const rows = await r.json();
            guestQueueItems = rows;
            renderGuestQueue();
        } catch(e) {}
    }
 
    function renderGuestQueue() {
        if (spotifyToken) return;
        // Rebuild from Supabase, deduplicate by uri
        const seen = new Set();
        songs = guestQueueItems.filter(function(row) {
            if (!row.uri || seen.has(row.uri)) return false;
            seen.add(row.uri);
            return true;
        }).map(function(row) {
            return {
                id: row.id || row.uri,
                uri: row.uri,
                title: row.title,
                artist: row.artist || '',
                art: row.art || '',
                dur: row.dur || '',
                votes: row.votes || 0,
                by: row.added_by || 'guest',
            };
        });
        renderQueue();
    }
 
    let _guestQueueWs = null;
    function subscribeGuestQueue() {
        if (!SUPABASE_URL || !bloomSessionId) return;
        if (!SUPABASE_URL || !bloomSessionId) return;
        const wsUrl = SUPABASE_URL.replace('https://', 'wss://').replace('http://', 'ws://');
        if (_guestQueueWs) { try { _guestQueueWs.onclose = null; _guestQueueWs.close(); } catch(e){} _guestQueueWs = null; }
        const ws = new WebSocket(`${wsUrl}/realtime/v1/websocket?apikey=${SUPABASE_ANON}&vsn=1.0.0`);
        _guestQueueWs = ws;
        ws.onopen = () => {
            ws.send(JSON.stringify({
                topic: 'realtime:*',
                event: 'phx_join',
                payload: {
                    config: {
                        postgres_changes: [{ event: '*', schema: 'public', table: QUEUE_TABLE, filter: `session_id=eq.${bloomSessionId}` }]
                    }
                },
                ref: '1',
            }));
        };
        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            const evt = msg.payload?.data?.type || msg.event;
            if (evt === 'INSERT') {
                const row = msg.payload?.data?.record || msg.payload?.record;
                if (row) {
                    toast(`🌸 ${row.added_by || 'A guest'} added "${row.title}"`);
                    fetchGuestQueue();
                    // If Spotify is connected, also queue it there
                    if (spotifyToken && row.uri) {
                        spotifyApiFetch(
                            `https://api.spotify.com/v1/me/player/queue?uri=${encodeURIComponent(row.uri)}`,
                            { method: 'POST' }
                        ).catch(() => {});
                    }
                }
            }
            // heartbeat handled by interval
        };
        ws.onclose = () => setTimeout(subscribeGuestQueue, 3000);
    }

    // ── Auto-clear played songs from Supabase ─────────────
    // Called whenever now-playing changes. Calls /api/queue-remove
    // (which uses the service key) to delete it from Supabase,
    // so it vanishes from every guest screen instantly.
    let lastClearedUri = null;
    function clearPlayedSongFromQueue(uri) {
        if (!uri) return;
        if (uri === lastClearedUri) return;
        lastClearedUri = uri;
        fetch('/api/queue-remove', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ uri, sessionId: bloomSessionId }),
        }).catch(() => {});
    }
 
 
    // ── Init ───────────────────────────────────────────────
    (async function init(){
        await handleOAuthCallback();
        if(!spotifyToken){
            const hash = window.location.hash.slice(1);
            const p = new URLSearchParams(hash);
            const t = p.get('access_token');
            if(t){
                spotifyToken = t;
                sessionStorage.setItem('spotify_access_token', t);
                const rt = p.get('refresh_token');
                if (rt) sessionStorage.setItem('spotify_refresh_token', rt);
                cleanOAuthUrl();
            }
        }
        if(!spotifyToken) spotifyToken = sessionStorage.getItem('spotify_access_token');

        // If we have a Spotify token but no Bloom session, create one.
        // Use refresh token if available, otherwise the access token.
        if (spotifyToken && !bloomSessionId) {
            const rt = sessionStorage.getItem('spotify_refresh_token');
            await createBloomSession(rt || null);
        }

        loadBloomHiddenQueueUris();
        render();
        startNowPlayingOrDemo();
        if (bloomSessionId) showPersistentQR(bloomSessionId);
        fetchGuestQueue();
        subscribeGuestQueue();
        // Every 10s, push any Supabase-queued songs to Spotify that may have been missed

    })();
