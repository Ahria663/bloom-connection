<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peanut Butter &amp; Jam — Guest</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Space+Mono:ital,wght@0,400;0,700;1,400&amp;family=Permanent+Marker&amp;display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --paper:#F1ECE0;--ink:#1B1B1B;--blue:#2A55E5;--pink:#FF4FA3;--muted:#B9B2A2;
      --rose:#FF4FA3;--rose-light:#FFD6EA;--rose-deep:#FF4FA3;--blush:#F1ECE0;--cream:#F1ECE0;
      --text-dark:#1B1B1B;--text-mid:#4A463C;--text-soft:#8A8578;--glass:#fff;--glass-border:#1B1B1B;--green:#1B1B1B;
    }
    html,body{background:var(--paper);}
    body{font-family:'Space Mono',ui-monospace,monospace;color:var(--ink);min-height:100vh;overflow-x:hidden;}
    .font-serif{font-family:'Archivo Black','Arial Black',sans-serif;letter-spacing:-0.02em;text-transform:uppercase;}
    .font-sans{font-family:'Space Mono',ui-monospace,monospace;}
    .hand{font-family:'Permanent Marker',cursive;}
    .app{max-width:430px;margin:0 auto;padding:24px 20px 110px;position:relative;z-index:1;min-height:100vh;}

    .header{border-bottom:3px solid var(--ink);padding-bottom:10px;margin-bottom:18px;}
    .logo{font-family:'Archivo Black','Arial Black',sans-serif;font-size:40px;font-weight:400;line-height:0.9;letter-spacing:-0.02em;text-transform:uppercase;color:var(--ink);}
    .logo .amp{color:var(--blue);}
    .logo-sub,.guest-badge{display:none;}
    .room-row{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-top:8px;text-transform:uppercase;}
    .room-row .on-air{display:inline-flex;align-items:center;gap:6px;}
    .room-row .on-air::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--pink);}

    .now-playing{display:flex;gap:16px;align-items:flex-start;background:none;border:0;padding:0;margin-bottom:22px;overflow:visible;}
    .np-glow,.eq-bars,.np-progress{display:none;}
    .np-art-wrap{position:relative;flex-shrink:0;width:130px;}
    .np-art-wrap::before{content:'';position:absolute;left:8px;top:8px;width:100%;height:100%;background:var(--blue);}
    .np-art,.np-art-placeholder{position:relative;width:130px;height:130px;border-radius:0;object-fit:cover;flex-shrink:0;border:3px solid var(--ink);background-color:var(--pink);background-image:radial-gradient(#1B1B1B 28%,transparent 30%);background-size:8px 8px;}
    .np-art-placeholder{display:flex;align-items:flex-end;justify-content:flex-start;padding:8px;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;}
    .np-copy{min-width:0;padding-top:2px;}
    .np-label{font-family:'Permanent Marker',cursive;font-size:18px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--blue);background:none;padding:0;transform:rotate(-3deg);display:inline-block;margin-bottom:4px;}
    .np-title{font-family:'Archivo Black','Arial Black',sans-serif;font-size:26px;line-height:1;text-transform:uppercase;color:var(--ink);white-space:normal;}
    .np-artist{font-size:13px;color:var(--ink);margin-top:6px;text-transform:uppercase;}
    .np-req{font-size:12px;margin-top:4px;}
    .np-req b{background:var(--pink);padding:0 6px;font-weight:700;}

    .section-header{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:0;}
    .section-title{font-family:'Archivo Black','Arial Black',sans-serif;font-size:20px;font-weight:400;color:var(--ink);text-transform:uppercase;}
    .section-hint{font-size:12px;color:var(--ink);font-style:normal;text-transform:uppercase;}
    .song-card{display:flex;align-items:baseline;gap:8px;background:transparent;border:0;border-bottom:1px dashed var(--ink);border-radius:0;padding:9px 0;margin-bottom:0;}
    .song-card.top,.song-card.mine{background:transparent;box-shadow:none;}
    .song-rank{font-size:14px;font-weight:700;color:var(--ink);min-width:26px;text-align:left;}
    .song-art,.song-art-ph{display:none;}
    .song-title{font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%;}
    .song-card.mine .song-title{background:var(--pink);padding:0 4px;}
    .song-dots{flex:1;border-bottom:2px dotted #8A8578;transform:translateY(-4px);min-width:12px;}
    .song-meta{font-size:12px;color:var(--ink);margin-top:0;white-space:nowrap;}
    .added-you{display:none;}
    .empty{text-align:left;padding:18px 0;color:var(--text-soft);font-size:13px;text-transform:uppercase;}

    .fab-add{
      position:fixed;left:20px;right:26px;bottom:30px;transform:none;z-index:50;
      background:var(--pink);border:3px solid var(--ink);border-radius:0;
      min-height:58px;padding:0 16px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      color:var(--ink);font-family:'Archivo Black','Arial Black',sans-serif;
      font-weight:400;font-size:18px;letter-spacing:-0.02em;text-transform:uppercase;
      box-shadow:6px 6px 0 var(--ink);
    }
    .fab-add:hover{transform:none;}
    .fab-add:disabled{opacity:.6;cursor:not-allowed;}

    body.add-mode .app, body.add-mode .fab-add{display:none;}
    .add-view{display:none;max-width:430px;margin:0 auto;padding:24px 20px 110px;min-height:100vh;flex-direction:column;gap:18px;}
    body.add-mode .add-view{display:flex;}
    .add-head{border-bottom:3px solid var(--ink);padding-bottom:10px;display:flex;justify-content:space-between;align-items:flex-end;}
    .add-brand{font-family:'Archivo Black',sans-serif;font-size:30px;line-height:0.9;}
    .add-brand .amp{color:var(--blue);}
    .add-np{display:flex;gap:14px;align-items:center;}
    .add-np-art{width:72px;height:72px;flex-shrink:0;background-color:var(--pink);background-image:radial-gradient(#1B1B1B 28%,transparent 30%);background-size:8px 8px;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--blue);background-position:center;background-repeat:no-repeat;}
    .add-np-art.has-art{background-size:cover;}
    .add-label{font-family:'Permanent Marker',cursive;font-size:16px;color:var(--blue);}
    .add-title{font-family:'Archivo Black',sans-serif;font-size:22px;text-transform:uppercase;line-height:1;}
    .add-artist{font-size:13px;text-transform:uppercase;}
    .add-search-label{font-family:'Archivo Black',sans-serif;font-size:26px;line-height:1;display:block;margin-bottom:8px;}
    .search-wrap{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);padding:0 12px;margin-bottom:8px;}
    .search-icon{color:var(--ink);font-size:0;width:18px;height:18px;flex-shrink:0;}
    .search-input{flex:1;border:0;background:transparent;font:inherit;font-size:16px;height:48px;color:var(--ink);outline:none;width:100%;padding:0;}
    .req-line{font-size:13px;}
    .req-line b{background:var(--pink);padding:0 6px;font-weight:700;}
    .req-line button{background:none;border:0;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;color:var(--ink);}
    .name-input{width:100%;margin:8px 0;padding:10px 12px;border:3px solid var(--ink);background:#fff;font:inherit;font-size:15px;}
    .results-list{display:flex;flex-direction:column;gap:0;}
    .result-item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--ink);cursor:default;background:transparent;border-radius:0;}
    .result-item.adding{opacity:.55;pointer-events:none;}
    .result-item.added .add-btn{display:none;}
    .result-item.added .added-mark{display:block;}
    .result-art{display:none;}
    .result-title{font-size:15px;font-weight:700;color:var(--ink);}
    .result-artist{font-size:12px;color:var(--ink);text-transform:uppercase;}
    .result-dur{display:none;}
    .add-btn{min-height:44px;padding:0 14px;border:3px solid var(--ink);background:var(--pink);color:var(--ink);font:inherit;font-weight:700;font-size:14px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;flex-shrink:0;text-transform:uppercase;}
    .added-mark{display:none;font-family:'Permanent Marker',cursive;font-size:18px;color:var(--blue);transform:rotate(-6deg);padding:0 6px;}
    .search-empty{padding:16px 0;color:var(--text-soft);font-size:13px;text-transform:uppercase;}
    .pick-bar{position:fixed;left:20px;right:20px;bottom:24px;max-width:390px;margin:0 auto;border:3px solid var(--ink);background:var(--blue);color:#fff;padding:12px 14px;display:none;justify-content:space-between;align-items:center;z-index:60;}
    body.add-mode .pick-bar.is-on{display:flex;}
    .pick-bar button{background:none;border:0;color:#fff;font:inherit;font-weight:700;font-size:14px;cursor:pointer;text-transform:uppercase;}

    .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;background:var(--ink);color:var(--paper);border-radius:0;padding:10px 22px;font-size:12px;font-weight:700;box-shadow:5px 5px 0 var(--pink);letter-spacing:0.06em;text-transform:uppercase;white-space:nowrap;font-family:inherit;display:none;}
    @keyframes fadeUp{from{opacity:0;}to{opacity:1;}}
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
    @keyframes popIn{from{opacity:0;transform:scale(.92) translateX(-50%);}to{opacity:1;transform:scale(1) translateX(-50%);}}
    @keyframes slideUp{from{opacity:0;transform:translateY(40px);}to{opacity:1;transform:translateY(0);}}
    @keyframes cardIn{from{opacity:0;}to{opacity:1;}}
    @keyframes eq1{0%,100%{height:6px;}50%{height:18px;}}
    @keyframes eq2{0%,100%{height:12px;}50%{height:6px;}}
    @keyframes eq3{0%,100%{height:8px;}50%{height:16px;}}
    @keyframes eq4{0%,100%{height:16px;}50%{height:8px;}}
    @keyframes eq5{0%,100%{height:10px;}50%{height:20px;}}
  </style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="logo">Peanut Butter <span class="amp">&amp;</span> Jam</div>
    <div class="logo-sub font-sans">collaborative playlist</div>
    <div class="room-row">
      <span id="roomCode">Room Nº ——</span>
      <span class="on-air" id="onAir">On air</span>
    </div>
    <div class="guest-badge font-sans">Guest</div>
  </div>

  <div class="now-playing" id="nowPlaying">
    <div class="np-glow"></div>
    <div class="np-art-wrap">
      <div class="np-art-placeholder" id="npArtPh"></div>
      <img class="np-art" id="npArt" style="display:none;" alt="album art"
        onerror="this.style.display='none';document.getElementById('npArtPh').style.display='flex'" />
    </div>
    <div class="np-copy">
      <div class="np-label font-sans" id="npLabel">now spinning</div>
      <div class="np-title font-serif" id="npTitle">—</div>
      <div class="np-artist font-sans" id="npArtist">Connecting to the playlist…</div>
      <div class="np-req" id="npReq" style="display:none;">req. by <b id="npRequestedBy"></b></div>
    </div>
    <div class="eq-bars paused" id="npEq">
      <div class="eq-bar" style="animation:eq1 .7s ease-in-out infinite;height:6px;"></div>
      <div class="eq-bar" style="animation:eq2 .6s ease-in-out infinite;height:12px;"></div>
      <div class="eq-bar" style="animation:eq3 .8s ease-in-out infinite;height:8px;"></div>
      <div class="eq-bar" style="animation:eq4 .65s ease-in-out infinite;height:16px;"></div>
      <div class="eq-bar" style="animation:eq5 .75s ease-in-out infinite;height:10px;"></div>
    </div>
    <div class="np-progress">
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-times"><span id="progressTime">0:00</span><span id="progressTotal">0:00</span></div>
    </div>
  </div>

  <div class="section-header">
    <div class="section-title font-serif">Up next</div>
    <div class="section-hint font-sans"><span id="queueCount">0 trks</span></div>
  </div>
  <div id="queue"></div>
</div>

<button class="fab-add font-sans" onclick="openAdd()">+ Request a track</button>

<div id="sheetEl" class="add-view" style="display:none;"></div>

<div class="toast" id="toast"></div>

<script>
const API_BASE   = 'https://bloom-connection-vznr.vercel.app';
const SUPABASE_URL  = 'https://wbtbkqczxttkntjzafgq.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndidGJrcWN6eHR0a250anphZmdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NTkzMTAsImV4cCI6MjA5MDIzNTMxMH0.81yC0IWVll9ktKJyciKnC-bsO9atFydvszES_zzo-4k';
const QUEUE_TABLE   = 'bloom_queue';

const SESSION_ID = new URLSearchParams(window.location.search).get('session') || '';

let guestName = localStorage.getItem('bloom_guest_name') || '';
let myAddedUris = new Set(JSON.parse(localStorage.getItem('bloom_my_uris') || '[]'));
let lastPickUri = localStorage.getItem('bloom_last_pick') || '';
let npProgress = 0, npDuration = 0, npPlaying = false;
let progressTimer = null;
let toastTimer = null;
let searchTimer = null;
let lastNowPlaying = null;

function roomCode() {
  return SESSION_ID ? String(SESSION_ID).replace(/[^a-z0-9]/gi,'').slice(0,6).toUpperCase() : '——';
}
function displayName() {
  return (guestName || '').replace(/^@/, '') || 'guest';
}
function paintRoom() {
  const el = document.getElementById('roomCode');
  if (el) el.textContent = 'Room Nº ' + roomCode();
}

function toast(msg, dur = 3000) {
  clearTimeout(toastTimer);
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  t.style.animation = 'none';
  void t.offsetWidth;
  t.style.animation = 'popIn .3s ease';
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, dur);
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtMs(ms) {
  const s = Math.max(0, Math.floor((ms||0)/1000));
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

function applyNowPlaying(data) {
  lastNowPlaying = data || {};
  const label  = document.getElementById('npLabel');
  const title  = document.getElementById('npTitle');
  const artist = document.getElementById('npArtist');
  const art    = document.getElementById('npArt');
  const artPh  = document.getElementById('npArtPh');
  const eq     = document.getElementById('npEq');

  npPlaying  = !!data.playing;
  npProgress = data.progress_ms || 0;
  npDuration = data.duration_ms || 0;

  if (label) label.textContent = 'now spinning';
  if (title) title.textContent  = data.title  || '—';
  if (artist) artist.textContent = data.artist || 'Waiting for music to start…';

  if (data.art) {
    art.src = data.art;
    art.style.display = '';
    artPh.style.display = 'none';
  } else {
    art.style.display = 'none';
    artPh.style.display = 'flex';
  }

  const match = supabaseQueue.find(s => (data.uri && s.uri === data.uri) || (data.title && s.title === data.title));
  const req = document.getElementById('npReq');
  const reqBy = document.getElementById('npRequestedBy');
  if (req && reqBy) {
    const who = (match && (match.added_by || match.by)) ? String(match.added_by || match.by).replace(/^@/, '') : '';
    if (who) {
      req.style.display = '';
      reqBy.textContent = who;
    } else {
      req.style.display = 'none';
    }
  }

  if (eq) eq.classList.toggle('paused', !npPlaying);
  updateProgress();
  syncAddNowPlaying();
}

function syncAddNowPlaying() {
  const data = lastNowPlaying || {};
  const t = document.getElementById('addNpTitle');
  const a = document.getElementById('addNpArtist');
  const art = document.getElementById('addNpArt');
  if (t) t.textContent = data.title || '—';
  if (a) a.textContent = data.artist || '';
  if (art) {
    if (data.art) {
      art.style.backgroundImage = 'url(' + JSON.stringify(data.art) + ')';
      art.classList.add('has-art');
    } else {
      art.style.backgroundImage = '';
      art.classList.remove('has-art');
    }
  }
}

function updateProgress() {
  const fill = document.getElementById('progressFill');
  const cur  = document.getElementById('progressTime');
  const tot  = document.getElementById('progressTotal');
  const d = npDuration || 1;
  const p = Math.min(npProgress, d);
  if (fill) fill.style.width = `${(p/d)*100}%`;
  if (cur) cur.textContent  = fmtMs(p);
  if (tot) tot.textContent  = fmtMs(d);
}

async function pollNowPlaying() {
  try {
    const sessionParam = SESSION_ID ? `?session=${SESSION_ID}` : '';
    const r = await fetch(`${API_BASE}/api/now-playing${sessionParam}`);
    if (!r.ok) return;
    const data = await r.json();
    if (data && (data.title || data.artist || data.playing)) applyNowPlaying(data);
  } catch(e) {}
}

function startProgressTick() {
  clearInterval(progressTimer);
  progressTimer = setInterval(() => {
    if (npPlaying && npDuration) {
      npProgress = Math.min(npProgress + 500, npDuration);
      updateProgress();
    }
  }, 500);
}

let supabaseQueue = [];

async function fetchQueue() {
  try {
    const sessionFilter = SESSION_ID ? `&session_id=eq.${SESSION_ID}` : '';
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/${QUEUE_TABLE}?select=*&order=created_at.asc${sessionFilter}`,
      { headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}` } }
    );
    if (r.ok) {
      const rows = await r.json();
      if (Array.isArray(rows) && rows.length) {
        supabaseQueue = rows;
        renderQueue();
        return;
      }
    }
  } catch(e) {}
  try {
    const r = await fetch(`${API_BASE}/api/queue-list${SESSION_ID ? '?session=' + encodeURIComponent(SESSION_ID) : ''}`);
    if (!r.ok) return;
    const data = await r.json();
    supabaseQueue = data.tracks || [];
    renderQueue();
  } catch(e) {}
}

function requesterOf(s) {
  const raw = s.added_by || s.by || '';
  const name = String(raw).replace(/^@/, '');
  if (myAddedUris.has(s.uri)) return 'YOU';
  return name || '—';
}

function renderQueue() {
  const el = document.getElementById('queue');
  const countEl = document.getElementById('queueCount');
  if (!supabaseQueue.length) {
    el.innerHTML = '<div class="empty">Nothing queued yet — be the first.</div>';
    countEl.textContent = '0 trks';
    updatePickBar();
    return;
  }
  countEl.textContent = `${supabaseQueue.length} trks`;
  el.innerHTML = supabaseQueue.map((s, i) => {
    const mine = myAddedUris.has(s.uri);
    const n = String(i + 1).padStart(2, '0');
    return `
    <div class="song-card ${i===0?'top':''}${mine?' mine':''}">
      <span class="song-rank font-sans">${n}</span>
      <span class="song-title">${esc(s.title)}</span>
      <span class="song-dots"></span>
      <span class="song-meta font-sans">${esc(requesterOf(s))}</span>
    </div>`;
  }).join('');
  updatePickBar();
  if (lastNowPlaying) applyNowPlaying(lastNowPlaying);
}

function subscribeQueue() {
  const wsUrl = SUPABASE_URL.replace('https://', 'wss://').replace('http://', 'ws://');
  const ws = new WebSocket(`${wsUrl}/realtime/v1/websocket?apikey=${SUPABASE_ANON}&vsn=1.0.0`);
  let heartbeatTimer = null;

  ws.onopen = () => {
    ws.send(JSON.stringify({
      topic: 'realtime:*',
      event: 'phx_join',
      payload: {
        config: {
          postgres_changes: [
            { event: '*', schema: 'public', table: QUEUE_TABLE, filter: SESSION_ID ? `session_id=eq.${SESSION_ID}` : undefined }
          ]
        }
      },
      ref: '1',
    }));
    heartbeatTimer = setInterval(() => {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: 'hb' }));
      }
    }, 25000);
  };

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      const evt = msg.payload?.data?.type || msg.event;
      if (evt === 'INSERT' || evt === 'UPDATE' || evt === 'DELETE') {
        fetchQueue();
      }
    } catch(err) {}
  };

  ws.onclose = () => {
    clearInterval(heartbeatTimer);
    setTimeout(subscribeQueue, 3000);
  };

  ws.onerror = () => {
    ws.close();
  };
}

function updateReqName() {
  const pill = document.getElementById('reqNamePill');
  if (pill) pill.textContent = displayName();
}

function editGuestName() {
  const input = document.getElementById('nameInput');
  if (!input) return;
  input.style.display = 'block';
  input.value = guestName.replace(/^@/, '');
  input.focus();
}

function saveGuestName(val) {
  guestName = String(val || '').trim();
  localStorage.setItem('bloom_guest_name', guestName);
  const input = document.getElementById('nameInput');
  if (input) input.style.display = 'none';
  updateReqName();
}

function updatePickBar() {
  const bar = document.getElementById('pickBar');
  const label = document.getElementById('pickLabel');
  if (!bar || !label) return;
  const uri = lastPickUri || [...myAddedUris][myAddedUris.size - 1];
  const idx = uri ? supabaseQueue.findIndex(s => s.uri === uri) : -1;
  if (idx < 0) {
    bar.classList.remove('is-on');
    return;
  }
  bar.classList.add('is-on');
  label.textContent = 'Your pick: Track B' + (idx + 1);
}

function openAdd() {
  document.body.classList.add('add-mode');
  const sheet = document.getElementById('sheetEl');
  sheet.style.display = 'flex';
  const data = lastNowPlaying || {};
  sheet.innerHTML = `
    <div class="add-head">
      <div class="add-brand">PB<span class="amp">&amp;</span>J</div>
      <div class="room-row" style="margin:0;">Room Nº ${esc(roomCode())}</div>
    </div>
    <div class="add-np">
      <div class="add-np-art" id="addNpArt"></div>
      <div>
        <div class="add-label">now spinning</div>
        <div class="add-title" id="addNpTitle">${esc(data.title || '—')}</div>
        <div class="add-artist" id="addNpArtist">${esc(data.artist || '')}</div>
      </div>
    </div>
    <div>
      <label class="add-search-label" for="searchInput">Request a track</label>
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1B1B" stroke-width="2.5" stroke-linecap="square"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        </span>
        <input class="search-input font-sans" id="searchInput" placeholder="Search a song or artist"
          oninput="handleSearch(this.value)" autocomplete="off" autofocus />
      </div>
      <div class="req-line">req. by <b id="reqNamePill">${esc(displayName())}</b> <button type="button" onclick="editGuestName()">(edit)</button></div>
      <input class="name-input font-sans" id="nameInput" placeholder="Your name"
        value="${esc(guestName.replace(/^@/, ''))}" style="display:none"
        onkeydown="if(event.key==='Enter'){saveGuestName(this.value)}"
        onblur="saveGuestName(this.value)" />
    </div>
    <div id="searchHint" class="search-empty">Type to search</div>
    <div class="results-list" id="results"></div>
    <div class="pick-bar" id="pickBar">
      <span id="pickLabel">Your pick</span>
      <button type="button" onclick="closeSheet(null)">See queue →</button>
    </div>`;
  syncAddNowPlaying();
  updatePickBar();
}

function closeSheet(e) {
  if (e && e.target && e.target.id && e.target.id !== 'sheetOverlay' && e.target.id !== 'pickBar') return;
  document.body.classList.remove('add-mode');
  const sheet = document.getElementById('sheetEl');
  sheet.style.display = 'none';
  sheet.innerHTML = '';
}

function handleSearch(q) {
  clearTimeout(searchTimer);
  const hint = document.getElementById('searchHint');
  const res  = document.getElementById('results');
  if (!q.trim()) {
    if (res) res.innerHTML = '';
    if (hint) { hint.style.display = 'block'; hint.textContent = 'Type to search'; }
    return;
  }
  if (hint) hint.style.display = 'none';
  searchTimer = setTimeout(() => doSearch(q), 350);
}

async function doSearch(q) {
  const res = document.getElementById('results');
  if (!res) return;
  res.innerHTML = `<div class="search-empty">Searching…</div>`;
  try {
    const sessionParam = SESSION_ID ? `&session=${SESSION_ID}` : '';
    const r = await fetch(`${API_BASE}/api/search?q=${encodeURIComponent(q)}${sessionParam}`);
    if (!r.ok) throw new Error('search failed');
    const data = await r.json();
    const tracks = data.tracks || [];
    if (!tracks.length) {
      res.innerHTML = `<div class="search-empty">No results found</div>`;
      return;
    }
    res.innerHTML = tracks.map(t => {
      const added = myAddedUris.has(t.uri);
      const meta = [t.artist, t.album].filter(Boolean).join(' / ');
      const payload = JSON.stringify(t).replace(/"/g,'&quot;');
      return `
      <div class="result-item ${added?'added':''}" id="ri-${t.id}">
        <div style="flex:1;min-width:0;">
          <div class="result-title">${esc(t.title)}</div>
          <div class="result-artist">${esc(meta)}</div>
        </div>
        <div class="added-mark">added!</div>
        <button type="button" class="add-btn" onclick='addSong(${payload})'>+ Add</button>
      </div>`;
    }).join('');
  } catch(e) {
    res.innerHTML = `<div class="search-empty">Search unavailable — try again</div>`;
  }
}

async function addSong(song) {
  const el = document.getElementById(`ri-${song.id}`);
  if (el) el.classList.add('adding');

  try {
    const r = await fetch(`${API_BASE}/api/queue-add`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        uri:      song.uri,
        title:    song.title,
        artist:   song.artist,
        art:      song.art,
        album:    song.album,
        dur:      song.dur,
        addedBy:  guestName ? `@${guestName.replace(/^@/, '')}` : 'guest',
        sessionId: SESSION_ID,
      }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Failed');

    myAddedUris.add(song.uri);
    lastPickUri = song.uri;
    localStorage.setItem('bloom_my_uris', JSON.stringify([...myAddedUris]));
    localStorage.setItem('bloom_last_pick', lastPickUri);
    supabaseQueue = supabaseQueue.concat([{
      uri: song.uri, title: song.title, artist: song.artist,
      art: song.art, dur: song.dur, added_by: guestName ? `@${guestName.replace(/^@/, '')}` : 'guest',
    }]);
    renderQueue();
    if (el) {
      el.classList.remove('adding');
      el.classList.add('added');
    }
    updatePickBar();
    toast('Added "' + song.title + '"');
    fetchQueue();
  } catch(e) {
    toast(e.message || 'Could not add song — try again');
    if (el) el.classList.remove('adding');
  }
}

(async function init() {
  paintRoom();
  if (!SESSION_ID) {
    document.getElementById('queue').innerHTML = '<div class="empty">No session found. Scan the host QR to join.</div>';
    document.getElementById('npTitle').textContent = 'No session';
    document.getElementById('npArtist').textContent = 'Scan the QR code to join a playlist';
    const air = document.getElementById('onAir');
    if (air) air.textContent = 'Standby';
    return;
  }
  await fetchQueue();
  await pollNowPlaying();
  startProgressTick();
  subscribeQueue();
  setInterval(pollNowPlaying, 5000);
})();
</script>
</body>
</html>
